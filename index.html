function afterAg(msg){save();closeSheet();render();toast(msg,[undoAct()]);}
function overlaps(k,id,s,e){return dayEvents(k).filter(x=>x.id!==id&&!x.cancelled&&!['libre','sueno','trayecto'].includes(x.kind)&&tm(x.start)<e&&tm(x.end)>s).map(x=>x.title);}
function evSetTime(k,id){
  const s=$('#evS').value,e=$('#evE').value;
  if(!s||!e||tm(e)<=tm(s))return toast('La hora de fin tiene que ser posterior');
  setEvTime(k,id,s,e);
}
function setEvTime(k,id,s,e){
  pushUndo();
  const hid=id.startsWith('h:')?id.slice(2):null,mi=hid?agOv(k,'in:'+hid):null;
  if(mi){agSet(k,'in:'+hid,{...mi,start:s,end:e});}
  else{const b=baseEvent(k,id);if(b&&b.start===s&&fmtT(tm(b.end))===e)agSet(k,id,null);else agSet(k,id,{start:s,end:e});}
  const ov=overlaps(k,id,tm(s),tm(e));
  afterAg(ov.length?`${fmtT(tm(s))}–${fmtT(tm(e))} · ojo, se solapa con: ${ov[0]}`:`Hora cambiada a las ${fmtT(tm(s))}`);
}
function evCancel(k,id){
  const r=($('#evR')||{}).value||'';
  pushUndo();
  agSet(k,id,{cancel:true,reason:r.trim()});
  if(S.timer&&id==='h:'+S.timer.hid&&S.timer.k===k)S.timer=null;
  const h=getH('fuerza'),pe=h&&h.plan&&h.plan.program&&h.plan.program[k];
  afterAg(id==='clase'&&pe&&pe.alt?'Clase anulada · el entreno pasa a sesión completa':id.startsWith('h:')?'Saltado este día':'Anulado este día');
}
function evMove(k,id,toArg){
  const to=toArg||$('#evD').value,hid=id.slice(2),h=getH(hid);
  if(!to||to===k)return toast('Elige otro día');
  if(isDone(h,k))return toast(`${h.name} ya está hecho ese día: no hace falta moverlo`);
  if(showOn(h,to))return toast(`Ese día ya tienes ${h.name}`);
  pushUndo();
  const t=habitTime(h,k)||{start:'18:00',end:'19:00'};
  const slot=freeSlot(to,tm(t.end)-tm(t.start),tm(t.start));
  agSet(k,id,{moveTo:to});agSet(to,'in:'+hid,{from:k,start:fmtT(slot),end:fmtT(slot+tm(t.end)-tm(t.start))});
  if(S.timer&&S.timer.hid===hid&&S.timer.k===k)S.timer=null;
  afterAg(`Movido al ${shortDate(to)} a las ${fmtT(slot)}${slot!==tm(t.start)?' (primer hueco libre)':''}`);
}
function quickMove(k,hid){closeSheet();evMove(k,'h:'+hid,addDays(k,1));}
// Busca el primer hueco libre del día a partir de la hora preferida (sin chocar con nada que no sea tiempo libre)
function freeSlot(k,dur,pref){
  const busy=dayEvents(k).filter(e=>!e.cancelled&&!['libre'].includes(e.kind)).map(e=>[tm(e.start),tm(e.end)]);
  const fits=s=>s>=7*60&&s+dur<=23*60&&!busy.some(([a,b])=>s<b&&s+dur>a);
  if(fits(pref))return pref;
  for(let d=15;d<=16*60;d+=15){if(fits(pref+d))return pref+d;if(fits(pref-d))return pref-d;}
  return pref;
}
function evRestore(k,id){
  pushUndo();
  const hid=id.startsWith('h:')?id.slice(2):null;
  const mi=hid?agOv(k,'in:'+hid):null;
  if(mi){agSet(mi.from,'h:'+hid,null);agSet(k,'in:'+hid,null);return afterAg('Vuelve a su día');}
  const o=agOv(k,id);
  if(o&&o.moveTo&&hid)agSet(o.moveTo,'in:'+hid,null);
  agSet(k,id,null);afterAg('Restaurado');
}

function weeksSince(k0,max,min=8){const t=todayK();if(!k0||k0>t)return min;return Math.max(min,Math.min(max,Math.floor(diffDays(weekStartK(k0),weekStartK(t))/7)+1));}
function heatCells(h,weeks,big){
  const fz=new Set(h.schedule.mode==='xweek'?[]:streaks(h).frozen||[]);
  const t=todayK(),start=addDays(weekStartK(t),-7*(weeks-1));let cells='';
  for(let d=0;d<7;d++)for(let w=0;w<weeks;w++){
    const k=addDays(start,7*w+d);cells+=`<i style="background:${cellColor(h,k,t,fz)}"${fz.has(k)?' title="Comodín"':''}></i>`;
  }
  let months='';
  if(big){let prev=-1;for(let w=0;w<weeks;w++){const m=pk(addDays(start,7*w)).getMonth();months+=`<span>${m!==prev?MES[m]:''}</span>`;prev=m;}}
  return{cells,months};
}
function cellColor(h,k,t,fz){
  if(k>t)return 'transparent';
  if(fz&&fz.has(k))return 'var(--ice)';
  if(k<h.start)return 'var(--heat-off)';
  const p=progress(h,k);
  if(p>=1)return h.color;
  if(p>0)return hexA(h.color,'66');
  return showOnBase(h,k)?'var(--heat-miss)':'var(--heat-empty)';
}

function edType(v){

/* ¿Cuándo? Siempre se pregunta al crear: solo un día o se repite */
function edWhenHTML(){
  if(D._tplEdit!=null)return '';
  const day=D._when==='once'?D.start:(D._day||todayK());
  return `<label class="lbl" id="edWhen">¿Cuándo?</label>
    <div class="seg"><button class="${D._when==='once'?'on':''}" onclick="edWhen('once')">Solo el ${shortDate(day)}</button><button class="${D._when==='repeat'?'on':''}" onclick="edWhen('repeat')">Se repite</button></div>
    ${D._when==='once'?`<div class="two" style="margin-top:10px;align-items:center"><span class="hint" style="margin:0">Día</span><input type="date" value="${D.start}" onchange="if(this.value){D.start=this.value;D.schedule.dates=[this.value];edR();}"></div>`
      :D._when?'':`<p class="hint ed-need">Elige una opción para poder crearlo.</p>`}`;
}
function edWhen(v){
  if(v==='once'){const day=D._when==='once'?D.start:(D._day||todayK());D._when='once';D.start=day;D.schedule={...D.schedule,mode:'dates',dates:[day]};}
  else{if(D._when!=='repeat'){const s0=D._sched0||{};D.schedule=JSON.parse(JSON.stringify(s0.mode==='dates'&&s0.dates&&s0.dates.length<=1?{...s0,mode:'daily',dates:[]}:s0));if(!D.schedule.mode)D.schedule.mode='daily';if(D.start<todayK())D.start=todayK();}D._when='repeat';}
  edR();
}
function edOnce(){const s=D.schedule;return s.mode==='dates'&&s.dates.length===1&&s.dates[0]===D.start;}
/* Hora del hábito: arriba del todo, con «Sin hora / Con hora», inicio y fin (o duración rápida) */
function edTimeHTML(){
  if(hasBase(D))return `<label class="lbl">Hora</label><p class="hint" style="margin-top:0">La hora de este hábito viene de tu agenda: cámbiala tocando o arrastrando su bloque en Agenda.</p>`;

  return `<label class="lbl">¿A qué hora?</label>
    <div class="seg"><button class="${t?'':'on'}" onclick="D.time=null;edR()">Sin hora</button><button class="${t?'on':''}" onclick="if(!D.time)D.time={start:'${fmtT(Math.min(22*60,Math.ceil((new Date().getHours()*60+new Date().getMinutes()+30)/30)*30))}',dur:30};edR()">Con hora</button></div>
    ${t?`<div class="two" style="margin-top:10px"><div><label class="lbl" style="margin-top:0">Empieza</label><input type="time" id="edTs" value="${t.start}" onchange="if(this.value){D.time.start=this.value;edR();}"></div>
      <div><label class="lbl" style="margin-top:0">Termina</label><input type="time" id="edTe" value="${end}" onchange="edEnd(this.value)"></div></div>
      <div class="chips">${[15,30,45,60,90].map(m=>`<button class="chip qt ${t.dur===m?'on':''}" onclick="D.time.dur=${m};edR()">${fmtDur(m)}</button>`).join('')}</div>

    :`<p class="hint" style="margin-top:6px">Sin hora sale en Hoy y en la agenda, en la franja «Sin hora» del día.</p>`}`;

function edEnd(v){if(!v||!D.time)return;let d=tm(v)-tm(D.time.start);if(d<=0)d+=24*60;if(d>16*60)return toast('Revisa la hora de fin');D.time.dur=d;edR();}
/* Elegir plantilla al crear un hábito */
function tplPicker(){
  const mine=S.templates||[],same=(a,b)=>a.name.trim().toLowerCase()===b.name.trim().toLowerCase();
  const own=S.habits.filter(h=>!h.archived&&!h.tutorial&&!mine.some(m=>same(m,h))).map(tplFrom); // tus hábitos actuales, también sirven de plantilla

  window._tplList=[...mine,...own,...ex];

    ${own.length?`<div class="sec">Copiar uno de tus hábitos</div>${own.map((t,i)=>row(t,`openEditor(null,{tpl:_tplList[${mine.length+i}]})`,info(t))).join('')}`:''}

function tplSheet(){

  openSheet(`<div class="sheet-title">📋 Plantillas</div><div class="sub mb12">Al crear un hábito puedes partir de una de estas. Cambiarlas no toca los hábitos que ya creaste.</div>

async function tplDel(i){const t=S.templates[i];if(!t)return;if(!await ask(`Se borra la plantilla «${t.name}». Los hábitos creados con ella no cambian.`,'Borrar',true))return tplSheet();
  pushUndo();S.templates.splice(i,1);save();tplSheet();toast('Plantilla borrada',[undoAct()]);}
function edPlan(v){D.plan.mode=v;edR();}
function edDay(d){const a=D.schedule.days;D.schedule.days=a.includes(d)?a.filter(x=>x!==d):[...a,d];edR();}
function edAddDate(){const v=$('#edDateIn').value;if(!v)return;if(!D.schedule.dates.includes(v))D.schedule.dates.push(v);edR();}
function edDelDate(k){D.schedule.dates=D.schedule.dates.filter(x=>x!==k);edR();}
function edSave(){
  D.name=(D.name||'').trim();
  if(!D.name)return toast('Ponle un nombre');
  if(D._tplEdit==null&&!D._when){const w=$('#edWhen');if(w)w.scrollIntoView({block:'center',behavior:'smooth'});return toast('Elige cuándo: solo ese día o se repite');}
  if(!D.emoji)D.emoji='•';
  if(D.type==='count'||D.type==='time'){if(!(D.target>0))return toast('El objetivo tiene que ser mayor que 0');}
  else D.target=1;
  if(D.type==='count'&&!(D.step>0))D.step=1;
  if(D.type==='checklist'){D.steps=D.steps.filter(s=>s.text.trim());if(!D.steps.length)return toast('Añade al menos un paso');}
  const s=D.schedule;
  if(s.mode==='weekdays'&&!s.days.length)return toast('Elige al menos un día');
  if(s.mode==='dates'&&!s.dates.length)return toast('Añade al menos una fecha');
  if(s.mode==='everyN'&&!(s.n>=1))s.n=2;
  // limpiar plan
  const p=D.plan;
  for(const d in p.weekly)if(!String(p.weekly[d]).trim())delete p.weekly[d];
  if(p.mode==='cycle'&&!p.cycle.some(c=>c.trim()))p.mode='none';
  if(D.time&&!D.time.start)delete D.time;
  if(D._tplEdit!=null){delete D._when;delete D._sched0;const i=D._tplEdit,old=S.templates[i];pushUndo();S.templates[i]={...tplFrom(D),tid:old.tid};D=null;save();closeSheet();tplSheet();return toast('Plantilla guardada',[undoAct()]);}
  if(D._saveTpl){S.templates=S.templates||[];const t=tplFrom(D),j=S.templates.findIndex(x=>x.name.toLowerCase()===t.name.toLowerCase());if(j>=0)S.templates[j]={...t,tid:S.templates[j].tid};else S.templates.push(t);}
  for(const k of ['_saveTpl','_fromTpl','_tplEdit','_day','_when','_sched0'])delete D[k];
  const isNew=D._new;delete D._new;
  if(!isNew&&S.packs&&Object.keys(S.packs).length)D.userEdited=true; // la próxima actualización del plan respeta tus cambios
  let before=null;if(!isNew){const i=S.habits.findIndex(h=>h.id===D.id);before=JSON.parse(JSON.stringify(S.habits[i]));S.habits[i]=D;}else S.habits.push(D);
  if(before)safetySnap(`Antes de editar «${before.name}»`);
  const id=D.id;D=null;save();closeSheet();render();
  toast(isNew?'Hábito creado ✨':'Cambios guardados',[['Deshacer',()=>{const i=S.habits.findIndex(h=>h.id===id);if(i<0)return;if(before)S.habits[i]=before;else S.habits.splice(i,1);save();render();toast('Deshecho ↺');}]]);
}

/* ═════════════ ESTADÍSTICAS ═════════════ */
function renderStats(){
  const t=todayK(),hs=S.habits.filter(h=>!h.archived);
  if(!hs.length){$('#statsMore').innerHTML='';$('#statsBody').innerHTML=`<div class="card empty"><div class="big">📊</div><h3>Sin datos todavía</h3><p>Cuando tengas hábitos y empieces a marcarlos, aquí verás tu evolución.</p></div>`;return;}
  const agg=(from,to)=>{let d=0,n=0;for(let k=from;k<=to;k=addDays(k,1)){const s=dayStats(k);d+=s.done;n+=s.total;}return n?d/n:null;};
  const today=dayStats(t);
  const r7=agg(addDays(t,-7),addDays(t,-1)),r30=agg(addDays(t,-30),addDays(t,-1));
  let bestS=null;for(const h of hs){const st=streaks(h);if(!bestS||st.cur>bestS.cur)bestS={...st,h};}
  const pct=v=>v===null?'—':Math.round(v*100)+'%';

  const first=hs.map(h=>h.start).sort()[0];
  const nW=Math.min(12,weeksSince(first,12,1));
  // Barras: desde la primera semana con hábitos (máx. 12)
  const tw=weekStartK(t);let bars='';
  for(let i=nW-1;i>=0;i--){
    const ws=addDays(tw,-7*i);let d=0,n=0;
    for(let j=0;j<7;j++){const k=addDays(ws,j);if(k>t)break;const s=dayStats(k);d+=s.done;n+=s.total;}
    const v=n?d/n:0;
    bars+=`<div class="bar"><em>${n?Math.round(v*100):''}</em><i class="${i===0?'cur':''}" style="height:${Math.max(2,v*100)}%"></i><span>${shortDate(ws).split(' ')[0]}/${pk(ws).getMonth()+1}</span></div>`;
  }

  // Mapa de calor global desde el inicio
  const W=weeksSince(first,26,10),start=addDays(tw,-7*(W-1));let cells='';
  const acc=S.settings.accent||'#22C55E';
  for(let d=0;d<7;d++)for(let w=0;w<W;w++){
    const k=addDays(start,7*w+d);let bg='transparent';
    if(k<=t){const s=dayStats(k);if(!s.total)bg='var(--heat-empty)';else{const v=s.done/s.total;bg=v===0?'var(--heat-miss)':v<.34?acc+'55':v<.67?acc+'99':v<1?acc+'CC':acc;}}
    cells+=`<i style="background:${bg}"></i>`;
  }


  const statsHTML=`
    <div class="kpis">
      <div class="kpi"><b>${today.done}/${today.total}</b><span>Hoy</span></div>
      <div class="kpi"><b>${pct(r7)}</b><span>Últimos 7 días</span></div>
      <div class="kpi"><b>${pct(r30)}</b><span>Últimos 30 días</span></div>
      <div class="kpi kpi-streak"><b>${bestS&&bestS.cur?`${ic('flame')}${bestS.cur}`:'—'}</b><span>${bestS&&bestS.cur?esc(bestS.h.emoji+' '+bestS.h.name):'Mejor racha actual'}</span></div>
    </div>
    <button class="banner" onclick="reviewSheet()">${ri('review')}<div><b>Revisión de la semana</b><small>Qué ha ido bien, qué falló y qué viene</small></div><span class="go">Abrir ›</span></button>
    ${hoursBlock()}
    <button class="banner" onclick="monthSheet()">${ri('calendar')}<div><b>Resumen de ${MONTHS[new Date().getMonth()].toLowerCase()}</b><small>Tu mes en números, con imagen para compartir</small></div><span class="go">Ver ›</span></button>
    <!--MAS-->
    <div class="sec">Cumplimiento por semana</div>
    <div class="card"><div class="bars">${bars}</div></div>
    ${loadBlock()}
    ${energyBlock()}
    <div class="sec">Todos los hábitos · desde el inicio</div>
    <div class="card"><div class="hm" style="grid-template-columns:repeat(${W},1fr)">${cells}</div></div>
`;
  const [top,more]=statsHTML.split('<!--MAS-->');$('#statsBody').innerHTML=top;$('#statsMore').innerHTML=more;
}

      ask(`Se importarán ${d.habits.length} hábitos y sustituirán los actuales. Antes guardo una copia automática de lo que tienes.`,'Importar',true).then(async ok=>{if(!ok)return;

    }catch(err){toast('❌ No se pudo leer el archivo');}

/* Planes (plan.json) */
function mergePack(pack){
  if(!pack||!isPlanKind(pack.kind)||!Array.isArray(pack.habits))return false;
  const base=blankHabit();
  for(const ph of pack.habits){
    const ex=getH(ph.id);
    if(ex){
      const keepDates=(ex.plan&&ex.plan.dates)||{},keepArch=ex.archived;
      const mine=ex.userEdited?{name:ex.name,emoji:ex.emoji,color:ex.color,desc:ex.desc,moment:ex.moment,target:ex.target,unit:ex.unit,steps:ex.steps,step:ex.step,type:ex.type,schedule:ex.schedule,start:ex.start,userEdited:true}:{};
      Object.assign(ex,ph,mine);
      ex.plan=Object.assign({},base.plan,ph.plan||{});ex.plan.dates=keepDates;ex.archived=keepArch;
    } else {
      const h=Object.assign(blankHabit(),ph);
      h.plan=Object.assign({},base.plan,ph.plan||{});h.plan.dates=h.plan.dates||{};
      h.schedule=Object.assign({},base.schedule,ph.schedule||{});
      S.habits.push(h);
    }
  }
  if(pack.agenda){S.agendaBase=pack.agenda;S.agendaUntil=pack.agendaUntil||'';S.classesKnownUntil=pack.classesKnownUntil||'';}
  S.packs=S.packs||{};S.packs[pack.id||'plan']=pack.version||1;
  save();savePlan();return true;
}
async function autoPlan(){
  if(!location.protocol.startsWith('http'))return;
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
    const r=await fetch('plan.json',{cache:'no-store',signal:ac.signal});clearTimeout(to);if(!r.ok)return;
    const p=await r.json();if(!p||!isPlanKind(p.kind))return;
    const cur=((S.packs||{})[p.id||'plan'])||0;
    if((p.version||1)>cur){if(cur)await safetySnap('Antes de actualizar el plan');mergePack(p);render();if(cur)toast('📥 Plan actualizado');}
  }catch(e){}
}

/* Ejemplos */
function mk(o){
  const h=blankHabit();
  Object.assign(h,o,{schedule:Object.assign(h.schedule,o.schedule||{}),plan:Object.assign(h.plan,o.plan||{})});
  h.steps=(o.steps||[]).map(t=>({id:uid(),text:t}));
  if(!o.plan||!o.plan.cycle)h.plan.cycle=['',''];
  return h;
}
function loadExamples(){
  const ex=EXAMPLES().map(mk);
  // No duplicar: si ya tienes un hábito con ese nombre (p. ej. Boxeo o Francés del plan), ese ejemplo no se añade
  const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const have=S.habits.map(h=>norm(h.name));
  const add=ex.filter(e=>!have.some(n=>n===norm(e.name)||n.startsWith(norm(e.name)+' ')));
  if(!add.length){closeSheet();return toast('Ya tienes estos hábitos');}
  add.forEach(e=>e.example=true);
  S.habits.push(...add);save();closeSheet();go('hoy');toast(`${add.length} ejemplo${add.length===1?'':'s'} añadido${add.length===1?'':'s'} · se quitan en Ajustes`);
}
async function removeExamples(){
  const ex=S.habits.filter(h=>h.example);if(!ex.length)return;
  if(!await ask(`Se quitarán ${ex.length} hábitos de ejemplo y lo que hayas marcado en ellos.`,'Quitar ejemplos',true))return;
  await safetySnap('Antes de quitar los ejemplos');dropUndo();
  const ids=new Set(ex.map(h=>h.id));S.habits=S.habits.filter(h=>!ids.has(h.id));
  for(const k in S.logs){for(const id of ids)delete S.logs[k][id];if(!Object.keys(S.logs[k]).length)delete S.logs[k];}
  for(const k in S.agenda){for(const id of ids){delete S.agenda[k]['h:'+id];delete S.agenda[k]['in:'+id];}if(!Object.keys(S.agenda[k]).length)delete S.agenda[k];}
  if(S.timer&&ids.has(S.timer.hid))S.timer=null;
  save();render();toast('Ejemplos quitados');
}

/* ═════════════ CUENTA ATRÁS ═════════════
   Próximos exámenes de la agenda y metas de los hábitos (B2, B1…), lo más cercano primero. */
const EXAM_RE=/examen|parcial|prueba|presentaci/i;
function countdowns(){
  const t=todayK(),lim=addDays(t,120),out=[],seen=new Set();
  for(const k of Object.keys(S.agendaBase||{}).filter(k=>k>=t&&k<=lim).sort())for(const e of S.agendaBase[k]){
    if(e.kind!=='fijo'||!EXAM_RE.test(e.title)||seen.has(e.title))continue;const o=agOv(k,e.id);if(o&&o.cancel)continue;
    seen.add(e.title);out.push({k,label:e.title.replace(' · ',' '),icon:'🎓',go:`closeSheet();pick('${k}')`});}
  for(const h of S.habits)if(!h.archived&&h.goal&&h.goal.date>=t&&/examen|objetivo|b1|b2|delf|first/i.test(h.goal.label))
    out.push({k:h.goal.date,label:h.goal.label,icon:h.emoji,go:hasCourse(h)?`courseSheet('${h.id}')`:`closeSheet();fullPlan('${h.id}')`});
  return out.sort((a,b)=>a.k<b.k?-1:1);
}
function cdText(k){const d=diffDays(todayK(),k);return d===0?'hoy':d===1?'mañana':d<60?`en ${d} días`:`en ${Math.round(d/7)} semanas`;}
function countdownRow(){
  const c=countdowns();if(!c.length)return '';
  const x=c[0];
  return `<button class="cd-row" onclick="countdownSheet()" aria-label="Cuenta atrás">⏳ <span><b>${esc(x.label)}</b> ${cdText(x.k)}</span>${c.length>1?`<i>+${c.length-1}</i>`:''}<em>›</em></button>`;
}
function countdownSheet(){
  const c=countdowns();
  openSheet(`<div class="sheet-title">⏳ Cuenta atrás</div><div class="sub mb12">Exámenes de tu agenda y metas de tus hábitos</div>
    ${c.map(x=>`<button class="row-btn" onclick="${x.go}"><span class="ri" style="font-size:18px">${x.icon}</span><div>${esc(x.label)}<small>${longDate(x.k)} · ${cdText(x.k)}</small></div><b class="cd-n">${Math.max(0,diffDays(todayK(),x.k))}<small>días</small></b></button>`).join('')}`);
}

/* ═════════════ CELEBRACIÓN AL CERRAR EL DÍA ═════════════ */
function celebrate(k){
  S.settings.celebrated=S.settings.celebrated||{};if(S.settings.celebrated[k])return;S.settings.celebrated[k]=true;
  for(const d in S.settings.celebrated)if(d<addDays(k,-14))delete S.settings.celebrated[d];save();
  const best=S.habits.filter(h=>!h.archived).map(h=>streaks(h)).sort((a,b)=>b.cur-a.cur)[0];
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div');el.className='celebrate';el.setAttribute('role','status');
  const C=['#22C55E','#60A5FA','#FBBF24','#F472B6','#C084FC','#2DD4BF','#FB923C'];
  el.innerHTML=(reduce?'':Array.from({length:42},(_,i)=>`<i style="left:${Math.random()*100}%;background:${C[i%C.length]};animation-delay:${Math.random()*.35}s;animation-duration:${1.3+Math.random()*.9}s;transform:rotate(${Math.random()*360}deg)"></i>`).join(''))+
    `<div class="cel-card"><div class="cel-big">${ic('flame',1.8)}</div><b>¡Día completo!</b><small>${best&&best.cur>1?`Racha de ${best.cur} ${best.unit==='sem'?'semanas':'días'}. Sigue así.`:'Todo lo de hoy, hecho.'}</small></div>`;
  document.body.appendChild(el);fxGoal(true);
  el.addEventListener('click',()=>el.remove());setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},2600);

// Mini-tour la primera vez que entras en una sección que no viste en el tutorial (pasos del guion por id)
const TOUR_MINI={hoy:['plan','paso1','campana'],agenda:['vista','dia','bloque','bloque-x'],prog:['detalle','mapa','detalle-x'],set:['avisos','avisos-x','repetir']};
const tourById=id=>TOUR_STEPS.find(s=>s.id===id);
// Cierra el teclado del móvil (si el paso siguiente no es escribir, el teclado taparía el botón)
function tourKeyboardOff(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))a.blur();}

/* ── ESTADO Y DATOS DE PRUEBA ── */
function tourState(){try{return JSON.parse(localStorage.getItem(TOUR_KEY))||{};}catch(e){return {};}}
function tourSet(o){const st={...tourState(),...o};try{localStorage.setItem(TOUR_KEY,JSON.stringify(st));}catch(e){}return st;}
function inTour(){try{return !!localStorage.getItem(TOUR_SNAP);}catch(e){return false;}}
function tourSandbox(){
  if(inTour())return;
  if(S.timer)stopTimer(true);
  localStorage.setItem(TOUR_SNAP,JSON.stringify(S,(k,v)=>HEAVY.has(k)||k==='_needPlanSave'?undefined:v)); // tal cual está ahora (sin marcar nada para la nube)
}
function tourPrepare(){
  if(getH('tour'))return;
  const n=new Date(),m=Math.min(22*60,Math.ceil((n.getHours()*60+n.getMinutes()+60)/30)*30);
  const h=mk({name:'Hábito de prueba',emoji:'🧪',color:'#F97316',type:'checklist',steps:['Calentar','Hacer la sesión','Estirar'],
    desc:'Plan de ejemplo: qué hacer exactamente hoy.\n- Calentar 5 min\n- Sesión principal 20 min\n- Estirar 5 min',time:{start:fmtT(m),dur:30}});
  h.id='tour';h.tutorial=true;h.start=addDays(todayK(),-60);h.plan={mode:'cycle',cycle:[h.desc]};
  S.habits.unshift(h);
  for(let i=1;i<=45;i++){const k=addDays(todayK(),-i);if((i*7)%10<7)(S.logs[k]=S.logs[k]||{}).tour={v:0,steps:h.steps.map(s=>s.id)};} // historial para las gráficas
  delete OPEN[todayK()+':tour'];save();
}
function tourRestore(){
  const snap=localStorage.getItem(TOUR_SNAP);
  if($('#focus.on'))closeFocus();
  closeSheet();
  if(snap){localStorage.setItem(KEY,snap);localStorage.removeItem(TOUR_SNAP);S=load();touchBaseline();dropUndo();}
  delete OPEN[todayK()+':tour'];sel=todayK();applyAccent();render();
}

/* ── MOTOR ── */
let TOUR=null;
function tourStart(name,steps,at=0){
  steps=(steps||[]).filter(Boolean);if(!steps.length||TOUR)return;
  if($('#focus.on'))closeFocus();closeSheet();
  tourSandbox();tourPrepare();render();
  TOUR={name,steps,i:at,done:0};tourSet({active:name,i:at});
  tourDom();tourShow();
}
function tourDom(){
  let r=$('#tour');if(r)r.remove();
  r=document.createElement('div');r.id='tour';
  r.innerHTML='<div class="tr-hole"></div><div class="tr-blk"></div><div class="tr-blk"></div><div class="tr-blk"></div><div class="tr-blk"></div><div class="tr-cover"></div><div class="tr-tip" role="dialog" aria-live="polite"><i class="tr-arr"></i><div class="tr-body"></div></div>';
  document.body.appendChild(r);
  const stop=e=>{e.preventDefault();e.stopPropagation();if(e.type==='pointerdown'||e.type==='touchstart')tourNudge();};
  r.querySelectorAll('.tr-blk,.tr-cover').forEach(b=>['pointerdown','touchstart','touchmove','mousedown','click','wheel'].forEach(t=>b.addEventListener(t,stop,{passive:false})));
  tourLoop();
}
function tourNudge(){const h=$('#tour .tr-hole');if(!h)return;h.classList.remove('nudge');void h.offsetWidth;h.classList.add('nudge');buzz();}
const tourCur=()=>TOUR&&(TOUR.nav||TOUR.steps[TOUR.i]);
function tourTarget(s){
  if(!s||!s.selector)return null;
  for(const el of document.querySelectorAll(s.selector)){const r=el.getBoundingClientRect();if(r.width&&r.height)return el;}
  return null;
}
function tourShow(){
  if(!TOUR)return;
  const s=TOUR.steps[TOUR.i];TOUR.nav=null;TOUR.acted=false;TOUR.pending=false;
  if(!s)return tourEnd(true);
  if(s.si&&!s.si())return tourNext(true);
  // Navegación obligatoria: si el paso es de otra sección, primero pulsas tú la pestaña
  if(s.seccion&&view!==s.seccion){
    if(sheetOn())closeSheet();
    TOUR.nav={id:'nav-'+s.seccion,selector:`nav button[data-v="${s.seccion}"]`,accion:'navegar',texto:`Pulsa «${TOUR_SECS[s.seccion]}» abajo para ir a esa sección.`,validar:()=>view===s.seccion};
    return tourPaint();
  }
  if(s.accion!=='input'&&s.accion!=='change')tourKeyboardOff();
  if(s.antes&&TOUR.prepared!==TOUR.i){TOUR.prepared=TOUR.i;try{s.antes();}catch(e){}}
  if(!s.selector)return tourPaint();
  // Esperar a que el elemento exista (pantallas y hojas que se están abriendo); si no aparece, se salta el paso
  const t0=Date.now(),idx=TOUR.i;
  const wait=()=>{if(!TOUR||TOUR.i!==idx||TOUR.nav)return;const el=tourTarget(s);
    if(el){const r=el.getBoundingClientRect(),vv=window.visualViewport,top=vv?vv.offsetTop:0,vh=vv?vv.height+vv.offsetTop:innerHeight;
      if(s.selector!=='#sheet'&&(r.top<top+60||r.bottom>vh-90))el.scrollIntoView({block:'center',behavior:'smooth'});
      return tourPaint();}
    if(Date.now()-t0>4000)return tourNext(true);
    setTimeout(wait,120);};
  wait();
}
function tourPaint(){
  const s=tourCur(),r=$('#tour');if(!s||!r)return;TOUR.pending=false;
  const real=TOUR.steps.filter(x=>!x.fin&&(!x.si||x.si())),n=real.indexOf(TOUR.steps[TOUR.i])+1,tot=real.length;
  const body=r.querySelector('.tr-body');
  body.innerHTML=s.fin?`<div class="tr-txt">${s.texto}</div><button class="btn pri tr-ok" onclick="tourInfoOk()">${s.boton||'Entendido'}</button>`
    :`<div class="tr-head"><span>Paso ${Math.max(1,n)}/${tot}</span><button class="tr-skip" onclick="tourAskSkip()">Saltar</button></div>
     <div class="tr-bar"><i style="width:${Math.round(Math.max(1,n)/tot*100)}%"></i></div>
     <div class="tr-txt">${s.texto}</div>${s.accion==='info'?`<button class="btn pri tr-ok" onclick="tourInfoOk()">Entendido</button>`:''}`;
  r.classList.toggle('info',s.accion==='info');r.classList.toggle('center',!s.selector);
  r.querySelector('.tr-tip').classList.remove('in');void r.offsetWidth;r.querySelector('.tr-tip').classList.add('in');
  TOUR.rect=null;tourPlace(true);
}
function tourAskSkip(){
  const b=$('#tour .tr-body');if(!b)return;
  b.innerHTML=`<div class="tr-txt"><b>¿Saltar el tutorial?</b><br>Lo que hayas probado se borra y tus datos quedan como estaban.</div>
    <div class="btns"><button class="btn ghost" onclick="tourPaint()">Seguir</button><button class="btn danger" onclick="tourEnd(false)">Saltar</button></div>`;
  tourPlace(true);
}
function tourInfoOk(){tourNext();}
function tourNext(skip){
  if(!TOUR)return;
  if(TOUR.pending)return;TOUR.pending=true; // hasta pintar el siguiente paso no se comprueba nada más
  if(TOUR.nav)return setTimeout(tourShow,250);
  const s=TOUR.steps[TOUR.i];
  if(!skip){TOUR.done++;if(s.seccion)tourSet({seen:[...new Set([...(tourState().seen||[]),s.seccion])]});try{s.despues&&s.despues();}catch(e){}}
  TOUR.i++;tourSet({i:TOUR.i});
  setTimeout(tourShow,skip?0:380);
}
function tourEnd(done){
  if(!TOUR)return;const name=TOUR.name;TOUR=null;
  const r=$('#tour');if(r){r.classList.add('out');setTimeout(()=>r.remove(),250);}
  tourRestore();
  tourSet({active:null,i:0,...(name==='full'?{done:true,offered:true,completed:!!done}:{})});
  if(!done)toast('Tutorial saltado · lo repites en Ajustes › Tutorial');
  else if(name!=='full')toast('✓ Listo');
}
// Detección de la acción sobre el elemento real (sin simular nada): el paso se valida tras el propio gesto
['click','input','change','scroll','touchend'].forEach(t=>document.addEventListener(t,e=>{
  const s=tourCur();if(!s||!s.selector||s.accion==='info'||TOUR.pending)return;
  const want={click:['click','navegar'],input:['input'],change:['change'],scroll:['scroll'],touchend:['gesto']}[t];
  if(!want.includes(s.accion))return;
  const tg=t==='scroll'?(e.target===document?document.scrollingElement:e.target):e.target;
  if(!tg||!tg.closest||!(tg.closest(s.selector)||(t==='scroll'&&tg.matches&&tg.matches(s.selector))))return;
  TOUR.acted=true;setTimeout(tourCheck,t==='click'?60:0);
},true));
function tourCheck(){
  const s=tourCur();if(!s||s.accion==='info'||TOUR.checking||TOUR.pending)return;
  const ok=s.validar?s.validar():TOUR.acted;
  if(ok){TOUR.checking=true;setTimeout(()=>{if(TOUR){TOUR.checking=false;tourNext();}},40);}
}
// Recoloca el foco y el bocadillo en cada fotograma (scroll, giro, teclado, hojas que se abren…) y comprueba el paso
function tourLoop(){
  if(!$('#tour'))return;
  if(TOUR){tourPlace(false);const now=Date.now();if(!TOUR.lastCheck||now-TOUR.lastCheck>200){TOUR.lastCheck=now;tourCheck();}}
  requestAnimationFrame(tourLoop);
}
function tourPlace(force){
  const r=$('#tour'),s=tourCur();if(!r||!s)return;
  const vv=window.visualViewport,vw=vv?vv.width+vv.offsetLeft:innerWidth,vh=vv?vv.height+vv.offsetTop:innerHeight,v0=vv?vv.offsetTop:0,h0=vv?vv.offsetLeft:0;
  const el=tourTarget(s);let b;
  if(el){const q=el.getBoundingClientRect(),p=s.selector==='#sheet'?0:6;
    b={x:Math.max(4,q.left-p),y:Math.max(4,q.top-p),w:0,h:0};b.w=Math.min(vw-4,q.right+p)-b.x;b.h=Math.min(vh-4,q.bottom+p)-b.y;}
  else b={x:vw/2,y:vh/2,w:0,h:0};
  const key=[b.x,b.y,b.w,b.h,vw,vh,v0].map(Math.round).join();
  if(!force&&key===TOUR.rect)return;TOUR.rect=key;
  const hole=r.querySelector('.tr-hole'),[bt,bb,bl,br]=r.querySelectorAll('.tr-blk'),cov=r.querySelector('.tr-cover');
  const rad=el?Math.min(18,parseFloat(getComputedStyle(el).borderRadius)+4||12):0;
  Object.assign(hole.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px',borderRadius:rad+'px'});
  const H=Math.max(vh,innerHeight)+200;
  Object.assign(bt.style,{left:0,top:0,width:'100%',height:b.y+'px'});
  Object.assign(bb.style,{left:0,top:b.y+b.h+'px',width:'100%',height:Math.max(0,H-b.y-b.h)+'px'});
  Object.assign(bl.style,{left:0,top:b.y+'px',width:b.x+'px',height:b.h+'px'});
  Object.assign(br.style,{left:b.x+b.w+'px',top:b.y+'px',width:Math.max(0,vw-b.x-b.w)+'px',height:b.h+'px'});
  Object.assign(cov.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});
  // Bocadillo: abajo, arriba, a un lado o (si no cabe) dentro de la pantalla sin taparlo del todo
  const tip=r.querySelector('.tr-tip'),arr=r.querySelector('.tr-arr'),M=12,G=14;
  const w=Math.min(340,vw-2*M);tip.style.width=w+'px';const th=tip.offsetHeight;
  let x,y,side;
  if(!el){x=h0+(vw-h0-w)/2;y=v0+(vh-v0-th)/2;side='none';}
  else{
    const below=vh-(b.y+b.h)-G-M,above=b.y-v0-G-M;
    if(below>=th){side='down';y=b.y+b.h+G;}
    else if(above>=th){side='up';y=b.y-G-th;}
    else if(vw-(b.x+b.w)-G-M>=w){side='right';x=b.x+b.w+G;y=b.y+b.h/2-th/2;}
    else if(b.x-G-M>=w){side='left';x=b.x-G-w;y=b.y+b.h/2-th/2;}
    else{side='none';y=below>above?vh-th-M:v0+M+20;}
    if(x==null)x=b.x+b.w/2-w/2;
  }
  x=Math.max(h0+M,Math.min(vw-M-w,x));y=Math.max(v0+M,Math.min(vh-M-th,y));
  Object.assign(tip.style,{left:x+'px',top:y+'px'});
  tip.dataset.side=side;
  if(side==='up'||side==='down')arr.style.left=Math.max(18,Math.min(w-18,b.x+b.w/2-x))+'px',arr.style.top='';
  else if(side==='left'||side==='right')arr.style.top=Math.max(18,Math.min(th-18,b.y+b.h/2-y))+'px',arr.style.left='';
}

/* ── ENTRADAS: primera vez, continuar a medias, Ajustes y mini-tours ── */
function tourCard(html){ // tarjeta centrada con el mismo aspecto (para ofrecer o continuar)
  let r=$('#tour');if(r)r.remove();
  r=document.createElement('div');r.id='tour';r.className='center info';
  r.innerHTML=`<div class="tr-hole" style="left:50%;top:50%;width:0;height:0"></div><div class="tr-blk" style="inset:0;width:100%;height:100%"></div><div class="tr-tip in" data-side="none"><div class="tr-body">${html}</div></div>`;
  document.body.appendChild(r);
  const t=r.querySelector('.tr-tip'),w=Math.min(340,innerWidth-24);t.style.width=w+'px';t.style.left=(innerWidth-w)/2+'px';t.style.top=Math.max(20,(innerHeight-t.offsetHeight)/2)+'px';
}
function tourCardClose(){const r=$('#tour');if(r&&!TOUR)r.remove();}
function tourOffer(){
  tourCard(`<div class="tr-fin">🧭</div><div class="tr-txt"><b>Aprende IronHabits en 3 minutos</b><br>Usando la app de verdad, paso a paso. Con un hábito de prueba: tus datos no se tocan.</div>
    <div class="btns"><button class="btn ghost" onclick="tourSet({offered:true});tourCardClose()">Ahora no</button><button class="btn pri" onclick="tourCardClose();tourStart('full',TOUR_STEPS)">Empezar</button></div>`);
}
function tourResumeAsk(){
  const st=tourState(),name=st.active||'full';
  tourCard(`<div class="tr-fin">⏯️</div><div class="tr-txt"><b>Tienes el tutorial a medias</b><br>¿Lo continúas donde lo dejaste o lo saltas?</div>
    <div class="btns"><button class="btn ghost" onclick="tourCardClose();tourRestore();tourSet({active:null,i:0,offered:true${name==='full'?',done:true':''}})">Saltar</button><button class="btn pri" onclick="tourCardClose();tourResume()">Continuar</button></div>`);
}
function tourSteps(name){
  if(name==='full')return TOUR_STEPS;
  const [kind,sec]=name.split(':');
  if(kind==='mini')return (TOUR_MINI[sec]||[]).map(tourById);
  return TOUR_STEPS.filter(s=>s.seccion===sec); // «sec:agenda»: el tutorial de una sección
}
function tourResume(){
  const st=tourState(),name=st.active||'full',steps=tourSteps(name);
  let i=Math.min(st.i||0,steps.length-1);const sec=(steps[i]||{}).seccion;
  while(i>0&&steps[i-1].seccion===sec)i--; // vuelve al principio de esa sección, con los datos de prueba limpios
  tourRestore();tourStart(name,steps,i);
}
function tourSection(sec){tourStart('sec:'+sec,tourSteps('sec:'+sec));}
function tourMaybeMini(v){
  if(TOUR||navigator.webdriver||$('#tour:not(.out)'))return;const st=tourState();
  if(!st.offered||st.active||(st.seen||[]).includes(v)||!TOUR_MINI[v])return;
  tourSet({seen:[...new Set([...(st.seen||[]),v])]});
  setTimeout(()=>{if(!TOUR&&view===v&&!sheetOn())tourStart('mini:'+v,tourSteps('mini:'+v));},450);
}
function tourBoot(){
  if(navigator.webdriver)return;const st=tourState();
  if(st.active||inTour())return tourResumeAsk();
  if(!st.offered)setTimeout(()=>{if(!sheetOn()&&!TOUR)tourOffer();},700);
}

/* ═════════════ ORDENAR ARRASTRANDO ═════════════ */
function sortSheet(){
  const hs=S.habits.filter(h=>!h.archived);
  openSheet(`<div class="sheet-title">Ordenar tus hábitos</div><div class="sub mb12">Mantén el dedo en ≡ y arrastra. El orden se usa en Progreso y en cada franja de Hoy cuando no hay hora.</div>
    <div id="sortList">${hs.map(h=>`<div class="so-row" data-id="${h.id}"><span class="hc-ico sm">${esc(h.emoji)}</span><b>${esc(h.name)}</b><button class="so-h" aria-label="Arrastrar ${esc(h.name)}">≡</button></div>`).join('')}</div>
    <div class="btns"><button class="btn pri" onclick="closeSheet()">Hecho</button></div>`);
  const L=$('#sortList');let drag=null,y0=0,before=null;
  L.addEventListener('pointerdown',e=>{const hd=e.target.closest('.so-h');if(!hd)return;e.preventDefault();drag=hd.closest('.so-row');y0=e.clientY;before=S.habits.map(h=>h.id);drag.classList.add('on');hd.setPointerCapture(e.pointerId);buzz();});
  L.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const dy=e.clientY-y0;drag.style.transform=`translateY(${dy}px)`;
    const rows=[...L.children],i=rows.indexOf(drag),r=drag.getBoundingClientRect(),mid=r.top+r.height/2;
    const nx=rows[i+1],pv=rows[i-1];
    if(nx&&mid>nx.getBoundingClientRect().top+nx.offsetHeight/2){L.insertBefore(nx,drag);y0+=nx.offsetHeight;drag.style.transform=`translateY(${e.clientY-y0}px)`;}
    else if(pv&&mid<pv.getBoundingClientRect().top+pv.offsetHeight/2){L.insertBefore(drag,pv);y0-=pv.offsetHeight;drag.style.transform=`translateY(${e.clientY-y0}px)`;}});
  const end=()=>{if(!drag)return;drag.classList.remove('on');drag.style.transform='';drag=null;
    const ids=[...L.children].map(r=>r.dataset.id),arch=S.habits.filter(h=>h.archived);
    const nw=[...ids.map(id=>getH(id)),...arch];if(nw.map(h=>h.id).join()===S.habits.map(h=>h.id).join())return;
    const prev=before;S.habits=nw;save();render();
    toast('Orden guardado',[['Deshacer',()=>{S.habits=prev.map(id=>getH(id)).filter(Boolean);save();render();}]]);};
  L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
}

/* ═════════════ EXPORTAR CSV ═════════════ */
function exportCSV(){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['fecha','hábito','hecho','minutos','valor','pasos hechos','pasos totales','nota','progreso']];
  for(const k of Object.keys(S.logs).sort())for(const id in S.logs[k]){const h=getH(id),e=S.logs[k][id];if(!h||!e)continue;
    rows.push([k,h.name,isDone(h,k)?'sí':'no',Math.round(minsOf(h,k)),h.type==='count'||h.type==='time'?e.v||0:'',(e.steps||[]).length,h.type==='checklist'?h.steps.length:'',e.note||'',
      e.m?Object.entries(e.m).map(([mid,v])=>{const mt=(h.metrics||[]).find(x=>x.id===mid);return `${mt?mt.label:mid}: ${v}`;}).join(' | '):'']);}
  for(const k of Object.keys(S.notes).sort())if(S.notes[k])rows.push([k,'(nota del día)','','','','','',S.notes[k],'']);
  const txt='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'); // ; y BOM: Excel en español lo abre bien
  shareFile(`ironhabits-registros-${todayK()}.csv`,txt,'text/csv','Registros de IronHabits').then(ok=>{if(ok){closeSheet();toast(`${rows.length-1} filas exportadas`);}});
}

/* ═════════════ DISPOSICIÓN DEL DÍA ═════════════
   Sueño y energía del check-in (40 % + 40 %) y carga de entreno (20 %): 0–100. Si sale baja, Hoy propone el Día flojo. */
function readiness(k){
  const c=(S.checkins||{})[k];if(!c||!c.sleep||!c.energy)return null;
  const aw=acwr(k),r=aw.enough?aw.r:null,ld=r==null||r<=1.3?1:r<=1.5?.5:0;
  const score=Math.round(((c.sleep-1)/4*.4+(c.energy-1)/4*.4+ld*.2)*100);
  const level=score>=70?'hi':score>=45?'mid':'lo';
  const msg=level==='hi'?'Buen día para apretar 💪':level==='mid'?'Día normal: sigue el plan':'Día para ir suave: prueba el Día flojo';
  return{score,level,msg,sleep:c.sleep,energy:c.energy,acwr:r};
}
function readinessSheet(){
  const k=todayK(),r=readiness(k);if(!r)return;
  openSheet(`<div class="sheet-title">⚡ Disposición de hoy: ${r.score}</div><div class="sub mb12">${r.msg}</div>
    <div class="rv-row">😴 Sueño<span class="p">${r.sleep}/5</span></div><div class="rv-row">⚡ Energía<span class="p">${r.energy}/5</span></div>
    <div class="rv-row">💪 Carga de entreno<span class="p">${r.acwr==null?'sin datos aún':r.acwr.toFixed(2)+' · '+acwrZone(r.acwr)[0]}</span></div>
    <p class="hint">Se calcula con tu check-in (sueño y energía, 40 % cada uno) y la carga de entreno (20 %). Por debajo de 45 te propongo el Día flojo; de 70 para arriba, buen día para apretar.</p>
    ${r.level==='lo'&&!(S.minDays||{})[k]?`<div class="btns"><button class="btn pri" onclick="closeSheet();toggleMinDay('${k}')">🪫 Activar Día flojo</button></div>`:''}
    <div class="btns" style="margin-top:8px"><button class="btn ghost" onclick="closeSheet();S.checkins[todayK()]={};save();render()">Repetir el check-in</button></div>`);
}

/* ═════════════ RECOLOCAR LO PENDIENTE (en un toque) ═════════════
   Lo de hoy que ya debería estar hecho y no lo está: te propongo el primer hueco libre en los próximos días
   (primero esta semana, para que siga contando en tu total semanal). */
function freeSlotStrict(k,dur,pref){
  const busy=dayEvents(k).filter(e=>!e.cancelled&&e.kind!=='libre').map(e=>[tm(e.start),tm(e.end)]);
  const fits=s=>s>=7*60&&s+dur<=22*60+30&&!busy.some(([a,b])=>s<b&&s+dur>a);
  if(fits(pref))return pref;for(let d=15;d<=15*60;d+=15){if(fits(pref+d))return pref+d;if(fits(pref-d))return pref-d;}return null;
}
function overdue(k){
  const t=todayK();if(k!==t)return [];const now=new Date().getHours()*60+new Date().getMinutes();
  return dayHabits(k).filter(h=>!isDone(h,k)&&!isExtra(h,k)&&(()=>{const x=habitTime(h,k);return x&&x.end?tm(x.end)<=now:now>=21*60;})());
}
function proposeSlot(h,k){
  const dur=Math.max(15,Math.round(evDur(h,k)||30)),x=habitTime(h,k),pref=x&&x.start?tm(x.start):18*60;
  const days=[...Array(7)].map((_,i)=>addDays(k,i+1));
  const order=[...days.filter(d=>weekStartK(d)===weekStartK(k)),...days.filter(d=>weekStartK(d)!==weekStartK(k))];
  for(const d of order){if(showOn(h,d))continue;const st=freeSlotStrict(d,dur,pref);if(st!=null)return{day:d,start:st,dur};}
  return null;
}
// Si no hay día al que moverlo es porque ya toca todos los días: se salta y se compensa sumando tiempo otro día (total semanal)
function noSlotWhy(h,k){const days=[...Array(7)].map((_,i)=>addDays(k,i+1));return days.every(d=>showOn(h,d))?'Toca cada día: sáltalo hoy y compensa sumando tiempo otro día de la semana':'No encuentro hueco libre en 7 días';}
function moveToSlot(k,hid,day,start,dur){
  agSet(k,'h:'+hid,{moveTo:day});agSet(day,'in:'+hid,{from:k,start:fmtT(start),end:fmtT(start+dur)});
  if(S.timer&&S.timer.hid===hid&&S.timer.k===k)S.timer=null;
}
function replanSheet(){
  const k=todayK(),list=overdue(k).map(h=>({h,p:proposeSlot(h,k)}));
  if(!list.length){closeSheet();return toast('No tienes nada pendiente de antes 🙌');}
  window._replan=list;
  openSheet(`<div class="sheet-title">🔁 Recolocar lo pendiente</div><div class="sub mb12">Lo de hoy que no ha dado tiempo. Te propongo el primer hueco libre${list.some(x=>x.p&&weekStartK(x.p.day)===weekStartK(k))?' (esta semana, así sigue contando en tu total)':''}.</div>
    ${list.map((x,i)=>`<div class="rp-row"><span class="hc-ico sm" style="--hc:${x.h.color}">${esc(x.h.emoji)}</span><div><b>${esc(x.h.name)}</b><small>${x.p?`→ ${DOW_N[dow(x.p.day)].toLowerCase()} ${shortDate(x.p.day)} · ${fmtT(x.p.start)}–${fmtT(x.p.start+x.p.dur)}`:noSlotWhy(x.h,todayK())}</small></div>
      ${x.p?`<button class="rp-b ok" onclick="replanOne(${i})">Mover</button>`:''}<button class="rp-b" onclick="replanSkip(${i})">Saltar</button></div>`).join('')}
    ${list.filter(x=>x.p).length>1?`<div class="btns"><button class="btn pri" onclick="replanAll()">Recolocar todo</button></div>`:''}
    <p class="hint">¿Prefieres otro día u hora? Toca el hábito en Hoy › ⋯ › Mover. Todo se puede deshacer.</p>`);
}
function replanOne(i){const x=window._replan[i];if(!x||!x.p)return;pushUndo();moveToSlot(todayK(),x.h.id,x.p.day,x.p.start,x.p.dur);save();render();toast(`${x.h.name} → ${DOW_N[dow(x.p.day)].toLowerCase()} ${fmtT(x.p.start)}`,[undoAct()]);replanSheet();}
function replanSkip(i){const x=window._replan[i];if(!x)return;pushUndo();agSet(todayK(),'h:'+x.h.id,{cancel:true,reason:'Saltado'});save();render();toast(`${x.h.name}: saltado`,[undoAct()]);replanSheet();}
function replanAll(){pushUndo();let n=0;for(const x of window._replan){if(!x.p)continue;const p=proposeSlot(x.h,todayK());if(!p)continue;moveToSlot(todayK(),x.h.id,p.day,p.start,p.dur);n++;}
  save();closeSheet();render();toast(`${n} recolocado${n===1?'':'s'}`,[undoAct()]);}

/* ═════════════ MODO «EMPEZAR» ═════════════
   Pantalla completa con el cronómetro, el plan y los pasos de la sesión. Mantiene la pantalla encendida. */
let _focus=null,_wake=null,_focT=null;
async function focusMode(id){
  const h=getH(id),k=todayK();if(!h)return;sel=k;closeSheet();
  if(h.type==='time'&&!(S.timer&&S.timer.hid===id))toggleTimer(h,k);
  else if(h.type!=='time'&&!(S.focus&&S.focus.hid===id)){S.focus={hid:id,k,t0:Date.now()};save();}
  _focus=id;try{if(navigator.wakeLock)_wake=await navigator.wakeLock.request('screen');}catch(e){}
  let el=$('#focus');if(!el){el=document.createElement('div');el.id='focus';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);}
  renderFocus();el.classList.add('on');lockScroll(true);clearInterval(_focT);_foFull=focusElapsed(h)>=focusTarget(h)&&focusTarget(h)>0;_focT=setInterval(tickFocus,1000);
}
/* Tiempo de la sesión: lo ya apuntado hoy (e.mins) + lo que lleva el cronómetro en marcha.
   Al salir o terminar, lo que llevas se suma a los minutos del día (sirve para el recuento de horas). */
function focusElapsed(h){const k=todayK(),e=entry(h,k)||{};
  if(h.type==='time'){const T=S.timer;return (e.v||0)*60000+(T&&T.hid===h.id?Date.now()-T.t0:0);}
  return (e.mins||0)*60000+(S.focus&&S.focus.hid===h.id?Date.now()-S.focus.t0:0);}
function focusTarget(h){const k=todayK();return (h.type==='time'?(h.target||0):evDur(h,k))*60000;}
function focusBank(h){ // pasa lo del cronómetro a los minutos del día y lo reinicia (sin contarlo dos veces)
  if(h.type==='time'||!S.focus||S.focus.hid!==h.id)return;
  const ms=Date.now()-S.focus.t0;if(ms>=30000){const e=ens(h,todayK());e.mins=Math.round(((e.mins||0)*60000+ms)/60000);}
  S.focus.t0=Date.now();
}
function renderFocus(){
  const h=getH(_focus),k=todayK();if(!h)return closeFocus();const e=entry(h,k)||{},pl=planFor(h,k),ms=focusElapsed(h);
  const tgt=focusTarget(h),tp=tgt?Math.min(1,ms/tgt):0,isT=h.type==='time';
  const p=isT?tp:progress(h,k),done=isDone(h,k);
  const sub=h.type==='checklist'?`${h.steps.filter(x=>(e.steps||[]).includes(x.id)).length} de ${h.steps.length} pasos`:h.type==='count'?`${e.v||0} de ${h.target}`:isT?(tgt?'de '+fmtDur(tgt/60000):'en marcha'):done?'hecho':'por hacer';
  $('#focus').innerHTML=`<div class="fo-top"><button class="fo-x" onclick="closeFocus()" aria-label="Salir">✕</button><span>Modo concentración</span><span class="fo-sp"></span></div>
    <div class="fo-hd" style="--hc:${h.color}"><div class="fo-ring" id="foRing">${ring(p,220,10,done?'var(--ok)':h.color)}<div>${isT?`<b id="foClock">${fmtClock(ms)}</b>`:`<b class="fo-pct">${Math.round(p*100)}%</b>`}<small>${sub}</small></div></div>
      ${!isT&&tgt?`<div class="fo-time ${tp>=1?'full':''}" id="foTime"><div class="fo-tl"><span>⏱ <b id="foClock">${fmtClock(ms)}</b></span><span>de ${fmtDur(tgt/60000)}</span></div><div class="fo-bar"><i id="foBar" style="width:${tp*100}%"></i></div></div>`:''}
      <div class="fo-name">${esc(h.emoji)} ${esc(h.name)}</div>${pl&&pl.tag?`<div class="fo-tag">${esc(pl.tag)}</div>`:''}</div>
    <div class="fo-body" style="--hc:${h.color}">${h.type==='checklist'?`<div class="steps">${h.steps.map(st=>{const on=(e.steps||[]).includes(st.id);return `<button class="step ${on?'on':''}" onclick="focusStep('${st.id}')"><span class="sb">${on?ic('check',3.2):''}</span>${esc(st.text)}</button>`;}).join('')}</div>`
      :h.type==='count'?`<div class="btns"><button class="btn ghost" onclick="focusCount(-1)">−</button><button class="btn pri" onclick="focusCount(1)">+${h.step||1}</button></div>`
      :h.type==='check'?`<button class="btn ${done?'ghost':'pri'}" style="width:100%" onclick="focusCheck()">${done?'Desmarcar':'✓ Marcar hecho'}</button>`:''}
      ${pl&&pl.blocks?`<div class="hc-plan">${blocksHTML(h,pl)}</div>`:pl&&pl.text?`<div class="hc-plan">${fmtPlan(pl.text)}</div>`:''}</div>
    <div class="fo-ft"><button class="btn ghost" onclick="closeFocus()">Salir</button><button class="btn pri" onclick="finishFocus()">✓ Terminar</button></div>
    <div class="fo-ask" id="foAsk" hidden></div>`;
}
// Tachar o sumar dentro del modo: actualiza el anillo y, si queda completo antes de tiempo, pregunta
function focusAfter(was){const h=getH(_focus),k=todayK();renderFocus();if(!h)return;
  if(!was&&isDone(h,k)){const ms=focusElapsed(h),tgt=focusTarget(h);if(tgt&&ms<tgt)focusAskDone(ms,tgt);else focusToastFull();}}
function focusStep(sid){const h=getH(_focus),k=todayK(),was=isDone(h,k);stepT(h.id,sid);focusAfter(was);}
function focusCount(d){const h=getH(_focus),k=todayK(),was=isDone(h,k);d>0?act(h.id,k):minus(h.id);focusAfter(was);}
function focusCheck(){const h=getH(_focus),k=todayK(),was=isDone(h,k);act(h.id,k);focusAfter(was);}
function focusAskDone(ms,tgt){const el=$('#foAsk');if(!el)return;
  el.innerHTML=`<div class="fo-ask-c"><div class="fo-ask-t">¿Ya has terminado?</div><p>Lo has completado todo, pero llevas <b>${Math.floor(ms/60000)} min</b> de los <b>${fmtDur(tgt/60000)}</b> previstos.</p>
    <div class="btns"><button class="btn ghost" onclick="$('#foAsk').hidden=true">Sigo un rato</button><button class="btn pri" onclick="finishFocus()">Sí, he terminado</button></div></div>`;
  el.hidden=false;}
let _foFull=false;
function focusToastFull(){toast('⏱ Tiempo cumplido y todo hecho. ¡Pulsa Terminar!');}
function tickFocus(){const h=getH(_focus);if(!h)return;const ms=focusElapsed(h),tgt=focusTarget(h),c=$('#foClock');if(c)c.textContent=fmtClock(ms);
  const tp=tgt?Math.min(1,ms/tgt):0,b=$('#foBar');if(b)b.style.width=tp*100+'%';
  if(h.type==='time'){const r=$('#foRing svg');if(r)renderFocus();} // en los de tiempo, el anillo es el tiempo
  if(tgt&&ms>=tgt&&!_foFull){_foFull=true;const t=$('#foTime');if(t)t.classList.add('full');buzz();setTimeout(buzz,150);if(h.type!=='time')toast('⏱ Tiempo cumplido'+(isDone(h,todayK())?'':'. Te quedan pasos por tachar'));}
}
function closeFocus(){const h=getH(_focus);if(h&&$('#focus.on')){focusBank(h);if(h.type!=='time'){S.focus=null;}save();}
  clearInterval(_focT);_foFull=false;const el=$('#focus');if(el)el.classList.remove('on');lockScroll(false);try{_wake&&_wake.release();}catch(e){}_wake=null;_focus=null;render();}
function finishFocus(){
  const h=getH(_focus),k=todayK();if(!h)return closeFocus();
  if(h.type==='time'){if(S.timer&&S.timer.hid===h.id)stopTimer(true);S.focus=null;return closeFocus();}
  pushUndo();focusBank(h);const was=isDone(h,k),e=ens(h,k);
  if(h.type==='check')e.v=1;else if(h.type==='count')e.v=Math.max(e.v||0,h.target||1);else e.steps=h.steps.map(x=>x.id);
  S.focus=null;closeFocus();return commit(h,k,was,progress(h,k));
}

/* ═════════════ HORAS DE IDIOMAS (Inglés y Francés) ═════════════
   Minutos de cada día: los apuntados (modo «Empezar», «Apuntar» o cronómetro). Un día completado sin minutos
   apuntados cuenta su duración prevista, marcada como «estimada». */
const HOURS_IDS=['fr','en'];
function hoursOf(h){
  let real=0,est=0,first=null;
  for(const k in S.logs){const e=S.logs[k][h.id];if(!e||k>todayK())continue;
    const m=e.mins||(h.type==='time'?e.v||0:0);
    if(m>0){real+=m;}else if(isDone(h,k)){est+=evDur(h,k);}else continue;
    if(!first||k<first)first=k;}
  const weeks=first?Math.max(1,Math.ceil((Math.round((pk(todayK())-pk(first))/864e5)+1)/7)):0;
  return {real,est,total:real+est,weeks,avg:weeks?(real+est)/weeks:0,first};
}
const fmtH=m=>{const h=m/60;return h<10?h.toFixed(1).replace('.',',')+' h':Math.round(h)+' h';};
function hoursCard(h){const x=hoursOf(h);
  return `<div class="hrs"><div><b>${fmtH(x.total)}</b><span>Total</span></div><div><b>${fmtH(x.avg)}</b><span>Media semanal</span></div><div><b>${x.weeks}</b><span>Semanas</span></div></div>
    <p class="hint" style="margin-top:6px">${x.total?`${fmtH(x.real)} cronometradas${x.est?` + ${fmtH(x.est)} estimadas (días hechos sin cronómetro)`:''}. Para que cuenten exactas, hazlo con ▶ Empezar.`:'Aún no hay horas: usa ▶ Empezar y se apuntan solas.'}</p>`;}
function hoursBlock(){const hs=S.habits.filter(h=>HOURS_IDS.includes(h.id)&&!h.archived);if(!hs.length)return '';
  return `<div class="sec">Horas de idiomas</div>${hs.map(h=>`<div class="card" style="--hc:${h.color}"><div class="hrs-h">${esc(h.emoji)} ${esc(h.name)}</div>${hoursCard(h)}</div>`).join('')}`;}

/* ═════════════ CURSO: PLAN COMPLETO, CLASE EN BLOQUES, MATERIAL Y NOTAS ═════════════
   Para hábitos con «course» (de momento, Inglés). IronHabits solo hace lo suyo: qué toca y cuándo, el botón exacto,
   el cronómetro, el material y las notas. El vocabulario y los errores van a HyperLingua; la corrección y el speaking,
   al proyecto de Claude; los tests se hacen y corrigen en su web o libro. */
const hasCourse=h=>!!(h&&h.course);
function dayEntry(h,k){const e=h&&h.plan&&h.plan.program&&h.plan.program[k];return e&&typeof e==='object'?e:null;}
const KIND_ICON={control:'📍',mock:'🧪',exam:'🎯',light:'💤'};
function dayIcon(e){if(!e)return '';if(KIND_ICON[e.mark])return KIND_ICON[e.mark];return (e.blocks&&e.blocks[0]&&e.blocks[0].i)||'•';}
function kitState(h){S.kit=S.kit||{};return S.kit[h.id]||(S.kit[h.id]={});}
// ── Acciones de los bloques (un solo botón cada uno) ──
function blockBtn(h,a){
  if(!a)return '';
  const lab=esc(a.l||'Abrir');
  if(a.k==='url')return `<a class="blk-go" href="${esc(a.u)}" target="_blank" rel="noopener">${lab} ↗</a>`;
  if(a.k==='claude')return `<button class="blk-go cl" onclick="blkClaude(this)" data-c="${esc(a.c)}">📋 ${esc(a.c.length>34?a.c.slice(0,32)+'…':a.c)}</button>`;

  if(a.k==='kit')return `<button class="blk-go" onclick="event.stopPropagation();courseSheet('${h.id}','kit')">🧰 ${lab}</button>`;
  return '';
}
async function blkClaude(btn){

  try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}
  if(!ok){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy');}catch(e){}ta.remove();}
  const h=S.habits.find(x=>x.kit&&x.kit.some(i=>i.id==='claude')),u=(h&&kitState(h).claudeUrl)||'https://claude.ai/';
  toast(ok?`📋 Copiado «${txt.slice(0,40)}». Pégalo en tu proyecto «Inglés B2»`:'No se pudo copiar: mantén pulsado el texto');
  if(ok)window.open(u,'_blank','noopener');
}
function blocksHTML(h,e,opt={}){
  if(!e||!e.blocks||!e.blocks.length)return '';
  const now=opt.cur;
  return `${e.notice?`<div class="blk-notice">${esc(e.notice)}</div>`:''}<div class="blks">${e.blocks.map((b,i)=>`<div class="blk ${now===i?'cur':''}" ${opt.ids?`id="blk${i}"`:''}>
      <div class="blk-h"><span class="blk-i">${b.i}</span><b>${esc(b.t)}</b>${b.m?`<span class="blk-m">${b.m}′</span>`:''}</div>
      ${b.d&&b.d.length?`<ul class="blk-d">${b.d.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${blockBtn(h,b.a)}</div>`).join('')}</div>`;
}
// ── Plan completo ──
let CS={id:null,tab:'plan'};
function courseSheet(id,tab){CS={id,tab:tab||'plan'};renderCourse();}
function renderCourse(){
  const h=getH(CS.id);if(!h||!h.course)return;const c=h.course,t=todayK();
  const left=Math.max(0,diffDays(t,c.exam)),start=c.start,totW=Math.ceil((diffDays(start,c.exam)+1)/7),curW=Math.max(0,Math.min(totW,Math.floor(diffDays(start,t)/7)+1));
  const ph=(c.phases||[]).find(p=>t>=p.from&&t<=p.to);
  const tabs=[['plan','📅 Plan'],['kit','🧰 Material'],['notas','📊 Notas']];
  const missing=(h.kit||[]).filter(x=>!kitState(h)[x.id]).length;
  openSheet(`<div class="crs" style="--hc:${h.color}">
    <div class="sheet-title">${esc(h.emoji)} ${esc(h.name)} · ${esc(c.examLabel)}</div>
    <div class="crs-top"><div><b>${left}</b><span>días para el examen</span></div><div><b>${curW||'—'}<small>/${totW}</small></b><span>semana</span></div><div><b>${ph?(c.phases.indexOf(ph)+1):'—'}<small>/${(c.phases||[]).length}</small></b><span>fase</span></div></div>
    ${ph?`<div class="crs-ph"><b>${esc(ph.name)}</b> · ${esc(ph.goal)}</div>`:''}
    <div class="crs-bar"><i style="width:${Math.round(curW/totW*100)}%"></i></div>

function weekSummary(ws){

  const hs=S.habits.filter(h=>!h.archived);let D=0,N=0;const per=[],miss=[],canc=[];let mins=0;
  for(const h of hs){let d=0,n=0,mn=0;for(const k of days){if(isCancelledH(h,k)){const o=agOv(k,'h:'+h.id);canc.push(`${h.emoji} ${h.name} · ${shortDate(k)}${o&&o.moveTo?` (movido al ${shortDate(o.moveTo)})`:''}`);continue;}
    if(!showOnBase(h,k))continue;n++;if(isDone(h,k)){d++;if((entry(h,k)||{}).min)mn++;}else if(k<todayK()&&!weekMet(h,k))miss.push(`${h.emoji} ${h.name} · ${DOW_N[dow(k)].toLowerCase()} ${shortDate(k)}`);}
    const g=weekGoal(h,ws),wm=weekMins(h,ws);
    if(n||wm){per.push({h,d,n,mn,g,wm});D+=d;N+=n;mins+=mn;}}
  const metr=[];for(const h of hs)for(const x of h.metrics||[]){const vals=days.map(k=>{const e=entry(h,k);return e&&e.m&&e.m[x.id]!=null?e.m[x.id]:null;}).filter(v=>v!=null);if(vals.length)metr.push(`${h.emoji} ${x.label}: ${vals.map(fmtNum).join(' → ')} ${x.unit||''}`);}
  const nws=addDays(ws,7),next=[];for(let i=0;i<7;i++){const k=addDays(nws,i);for(const e of dayEvents(k))if(e.id==='clase'||/examen|prueba|parcial|presentaci/i.test(e.title))next.push(`${DOW_N[dow(k)].slice(0,3)} ${shortDate(k)} · ${e.title} (${fmtT(tm(e.start))})`);}

function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);}
function icsSheet(){
  const t=todayK(),until=S.agendaUntil||addDays(t,28);
  openSheet(`<div class="sheet-title">🔔 Avisos en tu calendario</div>
    <p class="hint">Se crea un archivo de calendario con tus tareas importantes (hábitos, clases, fútbol, partido) y un aviso 5 minutos antes. Ábrelo y añádelo a Google Calendar o al Calendario de Apple: te avisará aunque la app esté cerrada.</p>
    <p class="hint">Si cambias la agenda (anular, mover…), vuelve a exportarlo. Te recomiendo exportar 2–4 semanas cada vez.</p>
    <div class="two" style="margin-top:10px"><div><label class="lbl" style="margin-top:0">Desde</label><input type="date" id="icF" value="${t}"></div><div><label class="lbl" style="margin-top:0">Hasta</label><input type="date" id="icT" value="${addDays(t,13)<until?addDays(t,13):until}"></div></div>
    <label class="chk"><input type="checkbox" id="icM"> Incluir comidas y cenas</label>
    <div class="btns"><button class="btn pri" onclick="exportICS()">Crear y abrir</button></div>`);

function buildICS(f,to,meals,descLen=600){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IronHabits//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:IronHabits'];let n=0;
  const dt=(k,hm)=>{let m=tm(hm),kk=k;if(m>=1440){m-=1440;kk=addDays(k,1);}return kk.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';};
  for(let k=f;k<=to;k=addDays(k,1))for(const e of dayEvents(k)){
    if(e.cancelled)continue;if(!(e.kind==='habito'||e.kind==='fijo'||(meals&&(e.id==='comida'||e.id==='cena'))))continue;
    const h=e.habit?getH(e.habit):null,pl=h?planFor(h,k):null;
    const desc=pl&&pl.text?pl.text.slice(0,descLen):(e.detail||'');
    L.push('BEGIN:VEVENT',`UID:${k}-${e.id.replace(':','-')}@ironhabits`,`DTSTAMP:${todayK().replace(/-/g,'')}T000000Z`,`DTSTART:${dt(k,e.start)}`,`DTEND:${dt(k,e.end)}`,
      `SUMMARY:${icsEsc((h?h.emoji+' ':'')+e.title)}`,`DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(e.title)}`,'TRIGGER:-PT5M','END:VALARM','END:VEVENT');n++;}
  L.push('END:VCALENDAR');return{text:L.join('\r\n'),n};
}
async function exportICS(){
  const f=$('#icF').value,to=$('#icT').value,meals=$('#icM').checked;if(!f||!to||to<f)return toast('Revisa las fechas');
  const{text,n}=buildICS(f,to,meals);if(!n)return toast('No hay tareas en esas fechas');
  await shareFile(`ironhabits-${f}_a_${to}.ics`,text,'text/calendar','Agenda de IronHabits');closeSheet();toast(`${n} tareas exportadas 🔔`);

/* ═════════════ AVISOS PUSH (también con la app cerrada) ═════════════
   La app calcula los avisos de los próximos 7 días (hora y texto) y se los pasa al servidor de avisos de IronHabits
   (Cloudflare, gratis). Él los envía a su hora al iPhone. Al servidor solo van la suscripción del móvil y esos avisos:
   ni registros ni notas. Cada cambio (marcar hecho, mover, saltar, pausa…) vuelve a mandar la lista, así no avisa
   de lo que ya hiciste. Su dirección la deja el despliegue en push.json. */
const PUSH_DAYS=7,PUSH_URL_KEY='ironhabits_push_url';
function pushCfg(){const p=S.settings.push||(S.settings.push={on:false,before:5,fixed:true,off:{}});if(!p.off)p.off={};if(p.before==null)p.before=5;if(p.fixed==null)p.fixed=true;return p;}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
async function pushURL(){
  try{const r=await fetch('push.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&/^https:\/\//.test(j.url||'')){localStorage.setItem(PUSH_URL_KEY,j.url);return j.url;}}}catch(e){}
  try{return localStorage.getItem(PUSH_URL_KEY)||null;}catch(e){return null;}
}
function pushId(){const p=pushCfg();if(!p.id){const a=new Uint8Array(12);crypto.getRandomValues(a);p.id=[...a].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,24).padEnd(16,'0');}return p.id;}
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
/* Lista de avisos: hábitos (y si quieres clases, fútbol…) de los próximos días, X minutos antes */
function pushItems(from=new Date()){
  const p=pushCfg(),out=[],k0=dk(from),now=from.getTime();
  for(let i=0;i<PUSH_DAYS;i++){const k=addDays(k0,i);
    for(const e of dayEvents(k)){
      if(e.cancelled||!e.start)continue;
      let h=null;
      if(e.kind==='habito'){h=getH(e.habit);if(!h||h.archived||p.off[h.id]||isPaused(h,k)||isDone(h,k))continue;}
      else if(!(e.kind==='fijo'&&p.fixed))continue;
      const d=pk(k),st=tm(e.start);d.setHours(0,st,0,0);const at=d.getTime()-p.before*60000;
      if(at<=now)continue;
      const pl=h?planFor(h,k):null,when=p.before?`En ${p.before} min · ${e.start}`:`Ahora · ${e.start}`;
      out.push({at,title:`${evIcon(e)} ${e.title}`.trim(),body:(when+(pl&&pl.text?' · '+pl.text.replace(/\s+/g,' ').slice(0,140):e.detail?' · '+e.detail:'')).slice(0,280),tag:k+'-'+e.id,url:'./'});}}
  return out.sort((a,b)=>a.at-b.at).slice(0,200);
}
let _pushT=null,_pushLast='';
function pushDirty(){if(!S.settings.push||!S.settings.push.on||inTour())return;clearTimeout(_pushT);_pushT=setTimeout(()=>pushSync(),4000);}
async function pushSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription();}
async function pushSync(force){
  const p=pushCfg();if(!p.on||!pushSupported()||inTour())return false;
  try{const url=await pushURL();if(!url)return false;const sub=await pushSub();
    if(!sub){p.on=false;p.err='perm';save();return false;}
    const items=pushItems(),sig=JSON.stringify([sub.endpoint,items]);
    if(!force&&sig===_pushLast)return true;
    const r=await fetch(url+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:pushId(),sub:sub.toJSON(),items})});
    if(!r.ok)throw new Error(r.status);_pushLast=sig;p.syncAt=Date.now();p.n=items.length;delete p.err;save();return true;
  }catch(e){p.err='net';return false;}
}
async function pushEnable(){
  if(!pushSupported())return toast(isStandalone()?'Este navegador no permite avisos':'Primero añade la app a la pantalla de inicio y ábrela desde ahí');
  const url=await pushURL();if(!url)return toast('El servidor de avisos aún no está listo');
  const perm=await Notification.requestPermission();if(perm!=='granted'){pushSheet();return toast('Sin permiso: actívalo en Ajustes del iPhone › Notificaciones › IronHabits');}
  try{const{publicKey}=await (await fetch(url+'/vapid')).json();const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(publicKey)});
    const p=pushCfg();p.on=true;save();
    if(!await pushSync(true))throw new Error('sync');
    pushSheet();toast(`🔔 Avisos activados · ${p.n} programados`);
  }catch(e){const p=pushCfg();p.on=false;save();pushSheet();toast('❌ No se pudieron activar. Revisa la conexión');}
}
async function pushDisable(){
  const p=pushCfg();p.on=false;save();
  try{const url=await pushURL(),sub=await pushSub();if(url)await fetch(url+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:pushId()})});if(sub)await sub.unsubscribe();}catch(e){}
  _pushLast='';pushSheet();renderSet();toast('Avisos desactivados');
}
async function pushTest(){const url=await pushURL();if(!url)return;try{await pushSync(true);const r=await fetch(url+'/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:pushId()})});toast(r.ok?'📨 Enviado: debería llegarte en unos segundos':'❌ No llegó: desactiva y vuelve a activar');}catch(e){toast('❌ Sin conexión');}}
function pushSet(field,val){const p=pushCfg();if(field==='off'){if(val)delete p.off[val];else return;}else p[field]=val;save();pushSync(true);}
function pushHabit(id,on){const p=pushCfg();if(on)delete p.off[id];else p.off[id]=true;save();pushDirty();}
function pushRowText(){const p=pushCfg();if(!pushSupported()&&!isStandalone())return 'Añade la app a la pantalla de inicio para activarlos';if(!p.on)return 'Desactivados · toca para activarlos';return `Activados · ${p.n||0} en los próximos ${PUSH_DAYS} días${p.err==='net'?' · sin conexión, se reintenta':''}`;}
async function pushSheet(){
  const p=pushCfg(),url=await pushURL(),ok=pushSupported(),hs=S.habits.filter(h=>!h.archived);
  const next=p.on?pushItems().slice(0,3):[];
  openSheet(`<div class="sheet-title">🔔 Avisos</div>
    <p class="hint">Te llegan al iPhone a su hora <b>aunque la app esté cerrada</b> y con el móvil bloqueado. Si ya marcaste un hábito, lo moviste o lo saltaste, no te avisa.</p>
    ${!url?`<div class="cx">⏳ <span>El servidor de avisos aún no está listo. En cuanto se publique, aquí podrás activarlos.</span></div>`
      :!ok?`<div class="cx">📲 <span>${isStandalone()?'Este navegador no admite avisos.':'Solo funcionan con la app <b>añadida a la pantalla de inicio</b> (Safari › Compartir › «Añadir a pantalla de inicio») y abierta desde ahí.'}</span></div>`
      :p.on?`<div class="btns"><button class="btn ghost" onclick="pushTest()">Enviar uno de prueba</button><button class="btn danger" onclick="pushDisable()">Desactivar</button></div>`
      :`<button class="btn pri" style="width:100%" onclick="pushEnable()">Activar avisos</button>`}
    ${p.err==='perm'?`<p class="hint">El permiso se retiró. Vuelve a pulsar «Activar avisos».</p>`:''}
    <label class="lbl">Cuándo</label>
    <div class="seg">${[0,5,10,15].map(m=>`<button class="${p.before===m?'on':''}" onclick="pushSet('before',${m});pushSheet()">${m?m+' min antes':'A la hora'}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" switch ${p.fixed?'checked':''} onchange="pushSet('fixed',this.checked)"> También clases, fútbol y lo fijo de la agenda</label>
    <label class="lbl">Qué hábitos</label>
    ${hs.map(h=>`<label class="chk"><input type="checkbox" switch ${p.off[h.id]?'':'checked'} onchange="pushHabit('${h.id}',this.checked)"> ${esc(h.emoji)} ${esc(h.name)}${habitTime(h,todayK())?'':' <span class="hint">· sin hora, no avisa</span>'}</label>`).join('')}
    ${next.length?`<label class="lbl">Próximos</label>${next.map(i=>`<div class="hint">${new Date(i.at).toLocaleString('es-ES',{weekday:'short',hour:'2-digit',minute:'2-digit'})} · ${esc(i.title)}</div>`).join('')}`:''}
    <p class="hint mt8">Se programan los próximos ${PUSH_DAYS} días cada vez que abres la app: ábrela al menos una vez por semana.</p>`);
}

/* ═════════════ ARRASTRAR BLOQUES ═════════════
   Móvil: mantener pulsado 0,35 s y arrastrar (así no se confunde con hacer scroll). Ordenador: arrastrar con el ratón.
   Encaja cada 15 min; al soltar guarda la hora nueva igual que el cambio manual (con Deshacer). */
function dragAttrs(k,e,px,lo,hi){
  if(e.cancelled||['libre','sueno'].includes(e.kind))return '';
  return ` data-drag="1" data-k="${k}" data-id="${e.id}" data-px="${px}" data-lo="${lo}" data-hi="${hi}" data-s="${tm(e.start)}" data-e="${tm(e.end)}"`;
}
const DRAG={el:null,timer:null,on:false,y0:0,x0:0,top0:0,d:0,tip:null,eatClick:false};
const SNAP=15;
function dragStart(el,x,y,instant){
  DRAG.el=el;DRAG.x0=x;DRAG.y0=y;DRAG.d=0;DRAG.on=false;DRAG.top0=parseFloat(el.style.top);
  clearTimeout(DRAG.timer);
  if(!instant)DRAG.timer=setTimeout(()=>dragActivate(),350);
}
function dragActivate(){
  const el=DRAG.el;if(!el)return;DRAG.on=true;
  const grid=el.closest('.agw');DRAG.cols=grid?[...grid.querySelectorAll('.agw-day')]:[];DRAG.toK=el.dataset.k;el.classList.add('dragging');document.body.classList.add('drag-on');
  buzz();
  DRAG.tip=document.createElement('div');DRAG.tip.className='drag-tip';document.body.appendChild(DRAG.tip);dragShow(DRAG.y0,DRAG.x0);
}
function dragNewTimes(el=DRAG.el){
  const px=+el.dataset.px,s=+el.dataset.s,e=+el.dataset.e,lo=+el.dataset.lo,hi=+el.dataset.hi,dur=e-s;
  let ns=Math.round((s+DRAG.d/px)/SNAP)*SNAP;ns=Math.max(lo,Math.min(hi-dur,ns));return[ns,ns+dur];
}
function dragShow(y,x){
  const el=DRAG.el,px=+el.dataset.px,[ns,ne]=dragNewTimes();
  el.style.top=(DRAG.top0+(ns-+el.dataset.s)*px)+'px';
  // Cambiar de día (solo hábitos, en Semana / 3 días)
  if(DRAG.cols&&DRAG.cols.length>1&&el.dataset.id.startsWith('h:')&&x!=null){
    const own=DRAG.cols.find(c=>c.dataset.colk===el.dataset.k),r0=own.getBoundingClientRect();
    let tgt=DRAG.cols.find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<r.right;})||(x<r0.left?DRAG.cols[0]:x>=r0.right?DRAG.cols[DRAG.cols.length-1]:own);
    DRAG.toK=tgt.dataset.colk;el.style.transform=`translateX(${tgt.getBoundingClientRect().left-r0.left}px)`;
  }
  const dl=DRAG.toK&&DRAG.toK!==el.dataset.k?`${DOW_N[dow(DRAG.toK)].slice(0,3).toLowerCase()} ${+DRAG.toK.slice(8)} · `:'';
  const sm=el.querySelector('small');if(sm)sm.textContent=`${fmtT(ns)}–${fmtT(ne)}`;
  if(DRAG.tip){DRAG.tip.textContent=`${dl}${fmtT(ns)}–${fmtT(ne)}`;DRAG.tip.style.left=x+'px';DRAG.tip.style.top=y+'px';}
}
function dragMove(x,y,ev){
  if(!DRAG.el)return;
  if(!DRAG.on){
    if(Math.hypot(x-DRAG.x0,y-DRAG.y0)>8){
      if(ev.type==='mousemove')dragActivate();      // ratón: arrastrar directamente
      else{clearTimeout(DRAG.timer);DRAG.el=null;return;} // dedo antes de tiempo: es scroll
    }else return;
  }
  if(ev.cancelable)ev.preventDefault();
  DRAG.d=y-DRAG.y0;dragShow(y,x);
}
function dragEnd(){
  clearTimeout(DRAG.timer);const el=DRAG.el;DRAG.el=null;
  if(DRAG.tip){DRAG.tip.remove();DRAG.tip=null;}
  document.body.classList.remove('drag-on');
  if(!el||!DRAG.on)return;
  DRAG.on=false;DRAG.eatClick=true;setTimeout(()=>DRAG.eatClick=false,400);
  el.classList.remove('dragging');
  const[ns,ne]=dragNewTimes(el),toK=DRAG.toK||el.dataset.k;DRAG.toK=null;DRAG.cols=null;
  if(toK!==el.dataset.k)return dragToDay(el.dataset.k,el.dataset.id.slice(2),toK,fmtT(ns),fmtT(ne));
  if(ns===+el.dataset.s){render();return;}
  setEvTime(el.dataset.k,el.dataset.id,fmtT(ns),fmtT(ne));
}
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-drag]');if(el&&e.touches.length===1)dragStart(el,e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
document.addEventListener('touchmove',dragTouchMove,{passive:false});
function dragTouchMove(e){if(DRAG.el)dragMove(e.touches[0].clientX,e.touches[0].clientY,e);}
document.addEventListener('touchend',dragEnd,{passive:true});
document.addEventListener('touchcancel',()=>{if(DRAG.on){DRAG.d=0;}dragEnd();},{passive:true});
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const el=e.target.closest('[data-drag]');if(el){dragStart(el,e.clientX,e.clientY,true);e.preventDefault();}});

/* ═════════════ MOVER DE DÍA ARRASTRANDO ═════════════ */
function dragToDay(k,hid,to,s,e){
  const h=getH(hid);if(!h)return render();
  if(isDone(h,k)){render();return toast(`${h.name} ya está hecho ese día: no se mueve`);}
  if(showOn(h,to)){render();return toast(`El ${shortDate(to)} ya tienes ${h.name}`);}
  pushUndo();
  const mi=agOv(k,'in:'+hid);
  if(mi&&mi.extra){agSet(k,'in:'+hid,null);agSet(to,'in:'+hid,{extra:true,start:s,end:e});}
  else if(mi&&mi.from){agSet(k,'in:'+hid,null);
    if(to===mi.from){agSet(mi.from,'h:'+hid,null);const b=baseEvent(to,'h:'+hid);if(!(b&&b.start===s))agSet(to,'h:'+hid,{start:s,end:e});}
    else{agSet(mi.from,'h:'+hid,{moveTo:to});agSet(to,'in:'+hid,{from:mi.from,start:s,end:e});}}
  else{agSet(k,'h:'+hid,{moveTo:to});agSet(to,'in:'+hid,{from:k,start:s,end:e});}
  if(S.timer&&S.timer.hid===hid&&S.timer.k===k)S.timer=null;
  const ov=overlaps(to,'h:'+hid,tm(s),tm(e));
  afterAg(`${h.emoji} ${h.name} → ${DOW_N[dow(to)].toLowerCase()} ${shortDate(to)} a las ${s}${ov.length?` · se solapa con ${ov[0]}`:''}`);
}

/* ═════════════ RESUMEN DE MAÑANA ═════════════ */
function tomorrowInfo(){
  const t=todayK(),tk=addDays(t,1);
  const evs=dayEvents(tk).filter(e=>!e.cancelled&&(e.kind==='habito'||e.kind==='fijo'));
  const bed=dayEvents(t).find(e=>e.kind==='sueno'&&!e.cancelled&&tm(e.start)>=18*60);
  const wake=bed?fmtT((tm(bed.start)+8*60)%1440):null;

/* ═════════════ CARGA DE ENTRENO (RPE × min, ACWR) ═════════════ */
function isTrain(h){return (h.metrics||[]).some(m=>m.id==='rpe');}
function sessLoad(h,k){if(!isDone(h,k))return null;const e=entry(h,k)||{},r=e.m&&e.m.rpe!=null?+e.m.rpe:null,mins=minsOf(h,k);return{load:(r??6)*mins,est:r==null,rpe:r,mins};}
function dayLoad(k){let L=0,est=0;for(const h of S.habits)if(!h.archived&&isTrain(h)){const x=sessLoad(h,k);if(x){L+=x.load;if(x.est)est++;}}return{L,est};}
function loadRange(a,b){let L=0,est=0;for(let k=a;k<=b;k=addDays(k,1)){const d=dayLoad(k);L+=d.L;est+=d.est;}return{L,est};}
function acwr(k=todayK()){
  const a=loadRange(addDays(k,-6),k).L,c=loadRange(addDays(k,-27),k).L/4;
  let first=null;for(const d of Object.keys(S.logs).sort()){if(S.habits.some(h=>isTrain(h)&&isDone(h,d))){first=d;break;}}
  return{a,c,r:c>0?a/c:null,enough:!!first&&diffDays(first,k)>=21};
}
function acwrZone(r){if(r==null)return['Sin datos','var(--muted)',''];if(r<0.8)return['Baja','#60A5FA','Entrenas menos de lo habitual: puedes apretar un poco.'];if(r<=1.3)return['Óptima','#22C55E','Zona segura: progresas sin riesgo.'];if(r<=1.5)return['Ojo','#FBBF24','Has subido rápido: no añadas más esta semana.'];return['Riesgo','#F87171','Pico de carga: baja intensidad o volumen unos días.'];}
function loadBlock(){
  if(!S.habits.some(h=>!h.archived&&isTrain(h)))return '';
  const t=todayK(),aw=acwr(t),[zn,zc,zt]=acwrZone(aw.enough?aw.r:null),tw=weekStartK(t);
  const weeks=[...Array(8)].map((_,i)=>{const ws=addDays(tw,-7*(7-i));return{ws,...loadRange(ws,addDays(ws,6))};});
  const mx=Math.max(1,...weeks.map(w=>w.L)),H=56,est=loadRange(addDays(t,-27),t).est;
  return `<div class="sec">Carga de entreno</div><div class="card">
    <div class="acwr"><b>${aw.enough&&aw.r!=null?aw.r.toFixed(2):'—'}</b><div style="flex:1"><span class="zone" style="background:color-mix(in srgb,${zc} 20%,transparent);color:${zc}">${aw.enough?zn:'Faltan datos'}</span><p class="hint" style="margin:4px 0 0">${aw.enough?zt:'Necesito 3 semanas de entrenos para calcular el ratio con fiabilidad.'}</p></div></div>
    <p class="hint">Ratio agudo:crónico = carga de los últimos 7 días ÷ media semanal de las últimas 4. Esta semana: ${Math.round(aw.a)} · media: ${Math.round(aw.c)} (RPE × minutos).</p>
    <div class="wk-hist">${weeks.map(w=>`<div title="${Math.round(w.L)}"><i style="height:${Math.max(2,Math.round(w.L/mx*H))}px;background:var(--acc)"></i><span>${shortDate(w.ws).split(' ')[0]}</span></div>`).join('')}</div>
    ${est?`<p class="hint" style="margin:8px 0 0">${est} sesión${est===1?'':'es'} sin RPE: cuento un 6. Apúntalo al acabar (botón «💪 RPE») para que sea exacto.</p>`:''}</div>`;
}
function rpeSheet(id,k){

/* ═════════════ SIMULACROS B2 FIRST ═════════════
   Tablas oficiales de Cambridge (practice test score → Cambridge English Scale), interpolación lineal entre puntos. */
const B2T={r:{n:'Reading',max:42,a:[[10,122],[16,140],[24,160],[37,180],[42,190]]},u:{n:'Use of English',max:28,a:[[7,122],[11,140],[18,160],[24,180],[28,190]]},
  w:{n:'Writing',max:40,a:[[10,122],[16,140],[24,160],[34,180],[40,190]]},l:{n:'Listening',max:30,a:[[8,122],[12,140],[18,160],[27,180],[30,190]]},s:{n:'Speaking',max:60,a:[[14,122],[24,140],[36,160],[54,180],[60,190]]}};
function toScale(p,raw){if(raw==null||raw==='')return null;raw=+raw;const a=B2T[p].a;if(raw<a[0][0])return null;for(let i=1;i<a.length;i++)if(raw<=a[i][0]){const[x0,y0]=a[i-1],[x1,y1]=a[i];return Math.round(y0+(raw-x0)*(y1-y0)/(x1-x0));}return 190;}
function mockScore(m){const sc={};let sum=0,n=0;for(const p in B2T){if(m[p]==null||m[p]==='')continue;const v=toScale(p,m[p]);sc[p]=v;sum+=v==null?120:v;n++;}return{sc,n,overall:n?Math.round(sum/n):null};}
function grade(o){if(o==null)return['—','var(--muted)'];if(o>=180)return['A · nivel C1','#22C55E'];if(o>=173)return['B · aprobado','#22C55E'];if(o>=160)return['C · aprobado','#84CC16'];if(o>=140)return['B1 · no aprueba el B2','#FBBF24'];return['Por debajo de B1','#F87171'];}

function mocksBlock(inDetail){

/* ═════════════ COPIAS AUTOMÁTICAS EN EL MÓVIL (IndexedDB) ═════════════
   Una copia al día (se guardan los últimos 7 días) y otra antes de cada cambio grande:
   importar, borrar todo, cargar desde la nube, actualizar el plan o restaurar. Se recuperan en Ajustes. */
const SNAP_DB='ironhabits-copias',OLD_SNAP_DB='rutina-copias',SNAP_DAYS=7,SNAP_PRE=6;
function snapDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('sin IndexedDB'));const r=indexedDB.open(SNAP_DB,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('snaps'))r.result.createObjectStore('snaps',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function snapRun(mode,fn){const db=await snapDB();return new Promise((res,rej)=>{const tx=db.transaction('snaps',mode),st=tx.objectStore('snaps');let out;
  const q=fn(st);if(q)q.onsuccess=()=>{out=q.result;};tx.oncomplete=()=>{db.close();res(out);};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error);};});}
const snapList=()=>snapRun('readonly',st=>st.getAll()).then(a=>(a||[]).sort((x,y)=>x.at<y.at?1:-1));
async function writeSnap(kind,reason){
  if(!S.habits.length&&!Object.keys(S.logs).length)return;
  const now=new Date(),o={id:kind==='auto'?'auto-'+todayK():'pre-'+now.getTime(),kind,reason:reason||'',at:now.toISOString(),
    habits:S.habits.length,days:Object.keys(S.logs).length,state:lightState()};
  await snapRun('readwrite',st=>st.put(o));
  let all=await snapList();
  // Además de la última del día, se guarda la PRIMERA de cada día: si te equivocas por la mañana y lo ves por la tarde, sigue ahí
  if(kind==='auto'&&!all.some(x=>x.id==='dia-'+todayK())){await snapRun('readwrite',st=>st.put({...o,id:'dia-'+todayK(),kind:'first',reason:'Primera copia del día'}));all=await snapList();}
  const autos=all.filter(x=>x.kind==='auto'),firsts=all.filter(x=>x.kind==='first'),pres=all.filter(x=>x.kind==='pre');
  const drop=[...autos.slice(SNAP_DAYS),...firsts.slice(SNAP_DAYS),...pres.slice(SNAP_PRE)];
  if(drop.length)await snapRun('readwrite',st=>{drop.forEach(x=>st.delete(x.id));});
}
// Copias guardadas con el nombre antiguo de la app: se pasan a la base nueva una vez
async function migrateSnaps(){
  if(localStorage.getItem('ironhabits_snapmig')||!window.indexedDB)return;
  try{const old=await new Promise((res,rej)=>{const r=indexedDB.open(OLD_SNAP_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('snaps'))r.result.createObjectStore('snaps',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    const items=await new Promise(res=>{const q=old.transaction('snaps').objectStore('snaps').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});old.close();
    if(items.length)await snapRun('readwrite',st=>{items.forEach(x=>st.put(x));});
    indexedDB.deleteDatabase(OLD_SNAP_DB);localStorage.setItem('ironhabits_snapmig','1');
  }catch(e){}
}
let _snapT=null;
function snapSoon(){if(inTour())return;clearTimeout(_snapT);_snapT=setTimeout(()=>writeSnap('auto').catch(()=>{}),4000);}

async function snapSheet(){
