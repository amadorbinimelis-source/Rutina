<style>
:root{
  --bg:#0A0A0D;--bg2:#111116;--card:#15151B;--card2:#1C1C24;--border:#25252E;
  --text:#F3F3F6;--muted:#8B8B99;--dim:#80808C;--acc:#22C55E;--danger:#EF4444;
  --r:18px;--nav:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--acc)}
input[type=date]{min-height:44px}
textarea{resize:vertical;min-height:64px;line-height:1.45}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--nav) + env(safe-area-inset-bottom) + 28px)}
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.h1{font-size:1.8rem;font-weight:800;letter-spacing:-.6px;line-height:1.05}
.sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.sub::first-letter{text-transform:uppercase}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:1.25rem;font-weight:600;flex:none}
.icon-btn.acc{background:var(--acc);border-color:var(--acc);color:#0A0A0D}
.top-actions{display:flex;gap:8px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.lbl{display:block;font-size:.7rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
.sec{font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.hint{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px}
.mt8{margin-top:8px}.mb12{margin-bottom:12px}

/* Semana */
.week{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.wk-nav{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.wk-btn{font-size:.78rem;font-weight:800;color:var(--acc);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:8px 12px}
.wk-btn:active{transform:scale(.96)}
.wk-lbl{font-size:.78rem;font-weight:700;text-align:center;line-height:1.2}
.wk-lbl small{display:block;font-size:.7rem;color:var(--acc);font-weight:700}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;border:1px solid transparent}
.wd-l{font-size:.7rem;font-weight:700;color:var(--muted)}
.wd-r{position:relative;width:32px;height:32px;display:grid;place-items:center}
.wd-r svg{position:absolute;inset:0}
.wd-r b{position:relative;font-size:.78rem;font-weight:700}
.wd.today .wd-l{color:var(--acc)}
.wd.sel{background:var(--card);border-color:var(--border)}
.wd.fut b{color:var(--muted)}

/* Resumen */
.sum{display:flex;align-items:center;gap:14px}
.sum-ring{position:relative;width:64px;height:64px;display:grid;place-items:center;flex:none}
.sum-ring svg{position:absolute;inset:0}
.sum-ring b{position:relative;font-size:.95rem;font-weight:800}
.sum-t{font-size:1.05rem;font-weight:700}
.sum-s{font-size:.8rem;color:var(--muted);margin-top:3px}
.back-today{font-size:.75rem;font-weight:700;color:var(--acc);padding:6px 10px;border:1px solid var(--border);border-radius:99px;margin-left:auto;flex:none}

/* Tarjeta de hábito */
.hc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 12px 12px 12px;margin-bottom:9px;transition:border-color .2s,opacity .2s}
.hc.done{border-color:color-mix(in srgb,var(--hc) 45%,var(--border))}
.hc.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.hc-row{display:flex;align-items:center;gap:11px}
.hc-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:color-mix(in srgb,var(--hc) 18%,transparent)}
.hc-ico.sm{width:36px;height:36px;border-radius:11px;font-size:1.1rem}
.hc-info{flex:1;min-width:0;padding:2px 0}
.hc-name{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.done .hc-name{color:var(--muted)}
.hc-meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.hc-ctl{display:flex;align-items:center;gap:6px;flex:none}
.ctl{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;flex:none}
.ctl svg{position:absolute;inset:0}
.ctl-in{position:relative;font-weight:800;font-size:.78rem;color:var(--hc)}
.ctl.full{background:var(--hc)}
.ctl.full .ctl-in{color:#0A0A0D;font-size:1.15rem}
.ctl.run{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hc) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.ctl:disabled{opacity:.35}
.mini{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-weight:700;color:var(--muted)}
.hc-plan{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--hc);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.5}
.pl-tag{font-size:.7rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--hc);margin-bottom:4px}
.pl-li{padding-left:14px;position:relative}
.pl-li::before{content:'';position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--hc)}
.pl-gap{height:6px}
.pl-h{font-weight:800;margin:2px 0 3px}
.hc-plan a{color:var(--hc);font-weight:700;text-decoration:none;display:inline-block;padding:3px 0}
.steps{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:.88rem;border-radius:10px}
.step .sb{width:22px;height:22px;border-radius:7px;border:2px solid var(--dim);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:#0A0A0D;flex:none}
.step.on{color:var(--muted);text-decoration:line-through}
.step.on .sb{background:var(--hc);border-color:var(--hc)}
.step:disabled{opacity:.5}

.empty{text-align:center;padding:38px 18px}
.empty .big{font-size:2.6rem;margin-bottom:10px}
.empty h3{font-size:1.1rem;margin-bottom:6px}
.empty p{color:var(--muted);font-size:.86rem;line-height:1.5;margin-bottom:18px}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:.92rem;text-align:center}
.btn.pri{background:var(--acc);color:#0A0A0D}
.btn.ghost{background:var(--card2);border:1px solid var(--border)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:#FF8A8A;border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--border);margin-bottom:8px;font-weight:600;font-size:.92rem}
.row-btn small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;margin-top:2px}
.row-btn.danger{color:#FF8A8A}

/* Nota */
.note textarea{background:transparent;border:none;padding:0;min-height:54px}

/* Lista de hábitos */
.hl{display:block;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:9px}
.hl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hl-name{flex:1;min-width:0;font-weight:700;font-size:.95rem}
.hl-name div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-sub{font-size:.74rem;color:var(--muted);font-weight:500;margin-top:2px}
.hl-pct{font-size:.8rem;font-weight:800;color:var(--hc)}
.hm{display:grid;gap:3px}
.hm i{display:block;border-radius:3px;aspect-ratio:1}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm-big{display:grid;gap:3px;width:max-content}
.hm-big i{display:block;width:13px;height:13px;border-radius:3px}
.hm-months{display:grid;gap:3px;width:max-content;font-size:.7rem;color:var(--muted);margin-bottom:4px;height:12px}
.hm-months span{white-space:nowrap;overflow:visible}

/* Stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.kpi span{font-size:.72rem;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--acc);min-height:3px;position:relative}
.bar i.cur{opacity:.55}
.bar span{font-size:.7rem;color:var(--muted)}
.bar em{font-style:normal;font-size:.7rem;color:var(--muted)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rk:last-child{border-bottom:none}
.rk-n{flex:1;min-width:0}
.rk-n div{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.rk-bar i{display:block;height:100%;border-radius:99px;background:var(--hc)}
.rk-p{font-size:.82rem;font-weight:800;width:44px;text-align:right}

/* Detalle */
.det-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}
.det-kpis div{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center}
.det-kpis b{display:block;font-size:1.2rem;font-weight:800;color:var(--hc)}
.det-kpis span{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Editor */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--border);font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:var(--acc);color:var(--text)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.types button{padding:11px;border-radius:13px;background:var(--bg2);border:1px solid var(--border)}
.types button b{display:block;font-size:.88rem}
.types button small{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.types button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emojis button{aspect-ratio:1;border-radius:10px;font-size:1.25rem;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center}
.emojis button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.colors{display:flex;flex-wrap:wrap;gap:9px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:10px 0;border-radius:11px;background:var(--bg2);border:1px solid var(--border);font-weight:700;text-align:center;color:var(--muted)}
.days button.on{background:var(--acc);border-color:var(--acc);color:#0A0A0D}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.list-row .x{width:40px;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);flex:none}
.plan-day{margin-bottom:8px}
.plan-day .pd-l{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);font-size:.78rem}
.chip button{color:var(--muted);font-weight:700}
.dp-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:.8rem;display:flex;gap:8px;align-items:flex-start}
.dp-item div{flex:1;min-width:0;white-space:pre-wrap;color:var(--muted)}
.dp-item b{color:var(--text);display:block;margin-bottom:2px}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100vh - env(safe-area-inset-top) - 70px);max-height:calc(100dvh - env(safe-area-inset-top) - 70px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:24px 24px 0 0;z-index:210;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.1,.5,1);padding:8px 18px calc(env(safe-area-inset-bottom) + 22px)}
.sheet.on{transform:none}
.sheet-top{position:sticky;top:-8px;z-index:5;background:var(--card);margin:-8px -18px 6px;padding:8px 12px 4px;display:flex;align-items:center;justify-content:center;touch-action:none}
.handle{width:40px;height:5px;border-radius:99px;background:var(--border);margin:6px auto 8px}
.sheet-x{position:absolute;right:10px;top:6px;width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-size:1.05rem;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center}
.sheet-title{font-size:1.2rem;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(12,12,16,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--dim)}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc)}

/* Agenda */
.ag-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ag-bar .seg{flex:1}
.ag-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.7rem;color:var(--muted);margin:2px 2px 12px}
.ag-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ag-day{position:relative;margin-left:0}
.ag-hour{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
.ag-hour.alt{background:rgba(255,255,255,.018)}
.ag-hour::after{content:'';position:absolute;left:44px;right:0;top:50%;border-top:1px dashed rgba(255,255,255,.05)}
.ag-hour span{position:absolute;top:4px;left:0;width:40px;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-ev{position:absolute;border-radius:9px;padding:3px 7px;font-size:.72rem;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));cursor:pointer;line-height:1.25;text-align:left;color:var(--text)}
.ag-ev b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev small{display:block;color:var(--muted);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev.short{display:flex;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
.ag-ev.short b{display:inline;flex:1;min-width:0}
.ag-ev.short small{display:inline}
.ag-ev.libre{background:transparent;border:1px dashed var(--border);color:var(--dim)}
.ag-ev.libre b{font-weight:500}
.ag-ev.trayecto{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--card)) 0 6px,var(--card) 6px 12px)}
.ag-ev.sueno{background:color-mix(in srgb,#475569 30%,var(--bg))}
.ag-ev.cancel{opacity:.38}
.ag-ev.cancel b{text-decoration:line-through}
.ag-ev .ok{color:var(--c);font-weight:800}
.ag-now{position:absolute;left:40px;right:0;height:2px;background:#EF4444;z-index:3}
.ag-now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#EF4444}
.agw-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 6px;-webkit-overflow-scrolling:touch}
.agw{display:grid;grid-template-columns:40px repeat(7,minmax(78px,1fr));min-width:600px}
.agw-hd{position:sticky;top:0;z-index:4;background:var(--bg);text-align:center;padding:6px 0 8px;cursor:pointer;border-bottom:1px solid var(--border)}
.agw-hd b{display:block;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.agw-hd span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:.95rem;margin-top:2px}
.agw-hd.today span{background:var(--acc);color:#0A0A0D}
.agw-hd.sel b{color:var(--text)}
.agw-hrs{position:relative}
.agw-hrs span{position:absolute;right:6px;font-size:.7rem;font-weight:700;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.agw-day{position:relative;border-left:1px solid var(--border)}
.agw-ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:2px 4px;overflow:hidden;background:color-mix(in srgb,var(--c) 30%,var(--card));border-left:3px solid var(--c);text-align:left;color:var(--text);line-height:1.15}
.agw-ev b{display:block;font-size:.7rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agw-ev small{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap}
.agw-ev.cancel{opacity:.35}.agw-ev.cancel b{text-decoration:line-through}
.agw-h{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.agw-h.today{color:var(--acc)}
.agw-col{position:relative;background:var(--card);border-radius:8px;cursor:pointer;border:1px solid var(--border)}
.agw-col.sel{border-color:var(--acc)}
.agw-b{position:absolute;left:2px;right:2px;border-radius:3px;background:var(--c);opacity:.9}
.agw-b.libre{background:transparent}
.agw-b.cancel{opacity:.25}
.agw-t{position:relative}
.agw-t span{position:absolute;right:2px;font-size:.7rem;color:var(--dim);transform:translateY(-50%)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);margin:6px 6px 0 0}
.badge.warn{color:#FBBF24;border-color:color-mix(in srgb,#FBBF24 40%,var(--border))}
.badge.bad{color:#FF8A8A;border-color:color-mix(in srgb,#EF4444 40%,var(--border))}
.ev-row{display:flex;gap:8px;align-items:center}
.ev-row input{flex:1}
.cx{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--border);border-radius:14px;margin-bottom:7px;font-size:.84rem;color:var(--muted)}
.cx button{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--acc)}
.chlog li{margin:4px 0 4px 16px;font-size:.82rem;color:var(--muted)}
.now-card{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--border));border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.now-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:4px 0}
.now-row .lb{font-size:.7rem;font-weight:800;letter-spacing:1px;color:var(--acc);width:62px;flex:none}
.now-row.next .lb{color:var(--muted)}
.now-row .tx{flex:1;min-width:0}
.now-row .tx b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-row .tx small{font-size:.74rem;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:9px;font-size:.84rem}
.banner b{display:block;font-size:.88rem}
.banner small{color:var(--muted);font-size:.74rem}
.banner .go{margin-left:auto;color:var(--acc);font-weight:800;font-size:.8rem;flex:none}
.banner.warn{border-color:color-mix(in srgb,#FBBF24 45%,var(--border))}
.min-btn{font-size:.75rem;font-weight:700;padding:7px 11px;border-radius:99px;border:1px solid var(--border);background:var(--card2);margin-left:auto;flex:none}
.min-btn.on{background:color-mix(in srgb,#FBBF24 18%,transparent);border-color:#FBBF24;color:#FBBF24}
.hc-more{display:block;width:100%;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding:8px 0 0}
.hc-min{margin-top:10px;display:flex;gap:8px}
.hc-min .btn{padding:11px;font-size:.84rem}
.metric{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.metric:last-child{border-bottom:none}
.metric div{flex:1;min-width:0}
.metric b{font-size:.86rem}
.metric small{display:block;color:var(--muted);font-size:.72rem}
.metric svg{flex:none}
.mrow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-bottom:8px}
.mrow label{font-size:.82rem}
.rv-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.86rem}
.rv-row:last-child{border-bottom:none}
.rv-row span.p{margin-left:auto;font-weight:800}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:.88rem}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
#timerPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);z-index:90;background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:8px 14px;font-size:.82rem;font-weight:700;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#timerPill.on{display:block}

.wk-card{padding:12px 14px}
.wk-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.wk-hd b{font-size:.92rem}.wk-hd small{color:var(--muted);font-size:.74rem}
.wk-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 0}
.wk-bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:3px}
.wk-bar i{display:block;height:100%;border-radius:99px}
.wk-row .nm{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-row .vl{font-size:.74rem;color:var(--muted);text-align:right;white-space:nowrap}
.wk-row .vl b{color:var(--text)}
.wk-hist{display:flex;gap:5px;align-items:flex-end;height:70px;margin-top:6px}
.wk-hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.wk-hist i{display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:2px}
.wk-hist span{font-size:.7rem;color:var(--muted)}

.fp-goal{background:color-mix(in srgb,var(--hc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--hc) 40%,var(--border));border-radius:14px;padding:12px 14px;margin:10px 0}
.fp-goal b{display:block;font-size:.95rem}.fp-goal small{color:var(--muted);font-size:.78rem}
.fp-tools{position:sticky;top:-1px;z-index:3;background:var(--bg2,var(--card));padding:8px 0;display:flex;flex-direction:column;gap:8px}
.fp-tools .row{display:flex;gap:8px}
.fp-tools input{flex:1}
.fp-month{font-size:.7rem;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:16px 0 6px}
.fp-item{border-bottom:1px solid var(--border)}
.fp-row{display:grid;grid-template-columns:62px 1fr 22px;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 2px}
.fp-row .d{font-size:.72rem;color:var(--muted);line-height:1.2}.fp-row .d b{display:block;color:var(--text);font-size:.86rem}
.fp-row .t{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fp-row .s{font-size:.9rem;text-align:center}
.fp-item.today .fp-row{background:color-mix(in srgb,var(--hc) 12%,transparent);border-radius:10px}
.fp-item.past .t{color:var(--muted)}
.fp-body{padding:0 2px 12px}
.dragging{z-index:30!important;box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 2px var(--c)!important;opacity:.95;transition:none!important;cursor:grabbing}
.drag-tip{position:fixed;z-index:400;pointer-events:none;background:var(--text);color:var(--bg);font-weight:800;font-size:.8rem;padding:5px 9px;border-radius:8px;transform:translate(-50%,-130%)}
body.drag-on{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ag-ev,.agw-ev{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ci{display:flex;gap:6px;margin-top:6px}
.ci button{flex:1;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-weight:800;font-size:.9rem}
.ci button.on{background:var(--acc);color:#000;border-color:var(--acc)}
.ci-lb{font-size:.78rem;font-weight:700;margin-top:8px}
.tm-row{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.85rem;border-bottom:1px solid var(--border)}
.tm-row:last-child{border-bottom:none}.tm-row span:first-child{width:46px;font-weight:800;color:var(--acc)}
.acwr{display:flex;align-items:center;gap:12px}
.acwr b{font-size:1.6rem;font-weight:800}
.zone{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:99px}
.mock-grid{display:grid;grid-template-columns:1fr 70px 56px;gap:6px 10px;align-items:center;font-size:.84rem}
.mock-grid input{padding:9px;text-align:center}
.mock-grid .sc{font-weight:800;text-align:right}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.rpe button{padding:12px 0;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-weight:800}
.cloud-ok{color:#22C55E}.cloud-bad{color:#F87171}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,10px);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:300;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{margin-left:12px;color:var(--acc);font-weight:800}

/* ═══ v1.11 · iPhone: tamaños táctiles (≥44 px), letra, contraste, tema oscuro ═══ */
:root{color-scheme:dark}
#app{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
nav .in{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
input,select{min-height:46px}
input[type=date],input[type=time]{min-height:46px;display:block;line-height:1.3}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
.icon-btn{width:44px;height:44px}
.wk-btn,.wk-lbl,.back-today,.min-btn{min-height:44px}
.back-today,.min-btn{display:inline-flex;align-items:center}
.wk-hd{min-height:44px;align-items:center}
.wk-row,.now-row,.step,.hc-info,.chk{min-height:44px}
.hc-more{min-height:44px;padding:0;display:flex!important;align-items:center;justify-content:center}
.sheet-x{width:44px;height:44px;top:4px;right:8px}
.mini{width:44px;height:44px;background:transparent;border:none;position:relative}
.mini::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card2);border:1px solid var(--border);z-index:-1}
.mini{z-index:0}
.colors{gap:4px}.colors button{width:44px;height:44px;border-width:3px;background-clip:content-box!important;padding:4px}
.colors button.on{border-color:var(--text)}
.seg button,.days button,.ci button{min-height:44px}
.ci button,.rpe button,.days button{text-align:center}
.list-row .x,.dp-item .x{width:44px!important;height:44px!important}
.chip{padding:0 0 0 12px}.chip button{min-width:40px;min-height:40px}
#timerPill{min-height:44px}
#toast{white-space:normal;width:max-content;max-width:calc(100vw - 24px);text-align:center;border-radius:18px;line-height:1.35;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 0}
#toast button{min-height:40px;padding:0 8px;margin-left:6px}
#toast.on{pointer-events:none}#toast.on button{pointer-events:auto} /* el aviso no tapa lo de debajo; solo sus botones se tocan */
body.pill-on #toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 70px)}
nav button{color:var(--muted)}
.emojis{grid-template-columns:repeat(7,1fr)}
.ag-ev.libre{color:var(--muted)}
/* Hojas: el teclado no tapa los campos (la hoja se sube con el teclado) */
.sheet{bottom:var(--kb,0px);max-height:calc(var(--vvh,100dvh) - env(safe-area-inset-top) - 70px)}
body.kb-on .sheet{transition:transform .32s cubic-bezier(.3,1.1,.5,1),bottom .15s ease;padding-bottom:16px}
body.kb-on nav,body.kb-on #timerPill{visibility:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ═════════════ SISTEMA VISUAL v2 (v1.12) ═════════════
   Una sola fuente de verdad: color, tipografía, espaciado (múltiplos de 4), radios, sombras y movimiento.
   Los nombres antiguos (--bg, --card, --muted…) se mantienen para no romper nada y apuntan a los nuevos valores. */
:root{
  /* Color */
  --bg:#0B0B0F;--bg2:#101015;--card:#141419;--card2:#1C1C23;--card3:#26262F;--border:#2A2A33;--border2:#363641;
  --text:#F4F4F6;--muted:#A3A3AE;--dim:#82828E;
  --acc-press:color-mix(in srgb,var(--acc) 82%,#000);--on-acc:#06140B;
  --warn:#FBBF24;--danger:#F87171;--info:#60A5FA;--ok:#22C55E;
  /* Tipografía (px) */
  --fs-title:32px;--fs-h2:22px;--fs-h3:17px;--fs-body:15px;--fs-sm:13px;--fs-xs:12px;
  /* Espaciado */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* Radios */
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r:16px;
  /* Sombras */
  --e1:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.03);--e2:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  /* Movimiento */
  --ease:cubic-bezier(.2,.8,.2,1);--t-fast:150ms;--t:250ms;
}
html{background:var(--bg)}
body{background:var(--bg);font-size:var(--fs-body);line-height:1.4;letter-spacing:-.01em} /* el rem sigue a 16 px */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-sm)}
button{transition:transform var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),opacity var(--t-fast)}
button:active:not(:disabled){transform:scale(.97)}
.view.on{animation:fade var(--t) var(--ease)}

/* Títulos y textos */
.top{margin-bottom:var(--s4);align-items:center}
.h1{font-size:var(--fs-title);font-weight:700;letter-spacing:-.04em;line-height:1.1}
.sub{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s1)}
.sec{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;color:var(--dim);margin:var(--s5) var(--s1) var(--s2)}
.sec::after{background:linear-gradient(90deg,var(--border),transparent)}
.lbl{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.hint{font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
.sheet-title{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.02em;padding-right:48px}

/* Superficies */
.card,.kpi,.hl,.banner{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e1)}
.card{padding:var(--s4);margin-bottom:var(--s3)}
.banner{padding:var(--s3) var(--s4);margin-bottom:var(--s3);font-size:var(--fs-sm);gap:var(--s3)}
.banner b{font-size:var(--fs-body);font-weight:600}
.banner small{font-size:var(--fs-sm)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--border));background:color-mix(in srgb,var(--warn) 6%,var(--card))}
.banner .go{font-size:var(--fs-sm);font-weight:600}

/* Botones */
.btn{min-height:50px;padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:var(--fs-body);font-weight:600}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.pri:active:not(:disabled){background:var(--acc-press)}
.btn.ghost{background:var(--card2);border:1px solid var(--border)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border:1px solid color-mix(in srgb,var(--danger) 28%,transparent)}
.btns{gap:var(--s2);margin-top:var(--s4)}
.icon-btn{border-radius:var(--r-md);background:var(--card2);border-color:var(--border)}
.icon-btn.acc{color:var(--on-acc);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
.row-btn{min-height:56px;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);margin-bottom:var(--s2);font-size:var(--fs-body);font-weight:600;gap:var(--s3)}
.row-btn small{font-size:var(--fs-sm);font-weight:400;color:var(--muted);margin-top:2px;line-height:1.35}
.row-btn.danger{color:var(--danger)}
.ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ic,var(--acc)) 14%,transparent);color:var(--ic,var(--acc))}
.ri svg,.ico svg{width:20px;height:20px}
.row-btn.danger .ri{--ic:var(--danger)}
.seg{gap:var(--s1)}
.seg button{border-radius:10px;font-size:var(--fs-sm);font-weight:600;padding:0 var(--s3);background:var(--card2);color:var(--muted)}
.seg button.on{background:color-mix(in srgb,var(--acc) 16%,var(--card2));border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--text)}
.days button.on,.ci button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.wk-btn{font-size:var(--fs-sm);font-weight:600;background:var(--card2);color:var(--text);padding:0 var(--s3)}
.back-today,.min-btn{font-size:var(--fs-sm);font-weight:600;border-radius:999px;padding:0 var(--s3);background:var(--card2)}
.min-btn.on{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:var(--warn);color:var(--warn)}

/* Campos */
input,textarea,select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input::placeholder,textarea::placeholder{color:var(--dim)}

/* Semana */
.wd{border-radius:var(--r-md);padding:var(--s1) 0 var(--s2)}
.wd-l{font-size:var(--fs-xs);font-weight:600;color:var(--dim)}
.wd.today .wd-l{color:var(--acc)}
.wd.sel{background:var(--card);border-color:var(--border2);box-shadow:var(--e1)}
.wd-r b{font-size:var(--fs-sm);font-weight:600;font-variant-numeric:tabular-nums}
.wk-lbl{font-size:var(--fs-sm);font-weight:600}
.wk-lbl small{font-size:var(--fs-xs);font-weight:500}

/* Resumen del día y KPIs */
.sum{gap:var(--s4)}
.sum-ring b{font-size:var(--fs-body);font-weight:700;font-variant-numeric:tabular-nums}
.sum-t{font-size:var(--fs-h3);font-weight:600}
.sum-s{font-size:var(--fs-sm);color:var(--muted)}
.kpis{gap:var(--s2);margin-bottom:var(--s3)}
.kpi{padding:var(--s4)}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.det-kpis{gap:var(--s2)}
.det-kpis div{border-radius:var(--r-md);background:var(--card2)}
.det-kpis b{font-size:var(--fs-h2);font-weight:700;font-variant-numeric:tabular-nums}
.det-kpis span{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em}

/* Tarjeta de hábito */
.hc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3);margin-bottom:var(--s2);box-shadow:var(--e1);transition:border-color var(--t),opacity var(--t),background-color var(--t)}
.hc.done{background:color-mix(in srgb,var(--hc) 5%,var(--card));border-color:color-mix(in srgb,var(--hc) 35%,var(--border))}
.hc-row{gap:var(--s3)}
.hc-ico{width:44px;height:44px;border-radius:var(--r-md);font-size:22px;background:color-mix(in srgb,var(--hc) 16%,var(--card2))}
.hc-ico.sm{width:36px;height:36px;border-radius:10px;font-size:18px}
.hc-name{font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em}
.hc-meta{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.ctl{width:48px;height:48px}
.ctl.full{box-shadow:0 4px 14px color-mix(in srgb,var(--hc) 35%,transparent)}
.ctl.full .ctl-in{color:var(--on-acc)}
.ctl-in svg{width:22px;height:22px;display:block}
.ctl-in{font-size:var(--fs-sm);font-weight:700;font-variant-numeric:tabular-nums}
.hc-plan{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--hc);border-radius:var(--r-md);padding:var(--s3);font-size:var(--fs-body);line-height:1.5;margin-top:var(--s3)}
.pl-tag{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em}
.pl-h{font-weight:600}
.hc-more{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.step{font-size:var(--fs-body);border-radius:var(--r-sm)}
.step .sb{width:24px;height:24px;border-radius:var(--r-sm);border-color:var(--border2);color:var(--on-acc)}
.step .sb svg{width:14px;height:14px}
.step.on{color:var(--dim)}

/* Lista de hábitos y gráficas */
.hl{padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.hl-name{font-size:var(--fs-body);font-weight:600}
.hl-sub{font-size:var(--fs-sm)}
.hl-pct{font-size:var(--fs-body);font-weight:700;font-variant-numeric:tabular-nums}
.bar i{border-radius:var(--r-sm) var(--r-sm) 3px 3px}
.rk{padding:var(--s3) 0}
.rk-n div{font-size:var(--fs-body);font-weight:600}
.rk-p{font-size:var(--fs-sm);font-weight:700;font-variant-numeric:tabular-nums}

/* Ahora / después */
.now-card{border-radius:var(--r-lg);padding:var(--s3) var(--s4);margin-bottom:var(--s3);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--acc) 30%,var(--border));box-shadow:var(--e1)}
.now-row .lb{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em}
.now-row .tx b{font-size:var(--fs-body);font-weight:600}
.now-row .tx small{font-size:var(--fs-sm)}

/* Hoja, aviso y barra inferior */
.ov{background:rgba(0,0,0,.55)}
.sheet{background:var(--card);border-color:var(--border2);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--e2);padding:var(--s2) var(--s4) calc(env(safe-area-inset-bottom) + var(--s5))}
.sheet-top{margin:-8px calc(-1 * var(--s4)) var(--s2)}
.handle{background:var(--border2);width:36px}
.sheet-x{background:var(--card2);border-color:var(--border);color:var(--muted)}
#toast{background:var(--card3);border-color:var(--border2);box-shadow:var(--e2);font-size:var(--fs-sm);font-weight:500;padding:var(--s3) var(--s4)}
#toast button{font-weight:700}
nav{background:color-mix(in srgb,var(--bg) 82%,transparent);border-top-color:var(--border)}
nav button{font-size:11px;font-weight:600;gap:3px}
nav button svg{width:24px;height:24px}
#timerPill{background:var(--card3);border-color:var(--border2);box-shadow:var(--e2);font-size:var(--fs-sm);font-weight:600}
.badge{font-size:var(--fs-xs);font-weight:600;border-radius:999px;padding:var(--s1) var(--s2)}
.chip{font-size:var(--fs-sm)}
.cx{border-radius:var(--r-md);font-size:var(--fs-sm)}
.zone{font-size:var(--fs-xs);font-weight:700}
.empty h3{font-size:var(--fs-h3);font-weight:600}
.empty p{font-size:var(--fs-body)}
.empty .big{font-size:40px}
.fp-goal{border-radius:var(--r-md)}
.dp-item{border-radius:var(--r-md);font-size:var(--fs-sm)}
.colors button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}

/* ═════════════ v1.13 · Navegación y Hoy ═════════════ */
.wk-nav{grid-template-columns:44px 1fr 44px;margin-bottom:var(--s2)}
.wk-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:var(--r-md);color:var(--muted)}
.icon-btn.bell{position:relative;color:var(--text)}
.icon-btn.bell i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;font-style:normal;display:grid;place-items:center;border:2px solid var(--bg)}
.icon-btn[hidden]{display:none}
.dayhead{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s1) var(--s1)}
.dh-ring{position:relative;width:40px;height:40px;flex:none}
.dh-ring svg{position:absolute;inset:0}
.dh-t{flex:1;min-width:0}
.dh-t b{display:block;font-size:var(--fs-h3);font-weight:600}
.dh-t small{font-size:var(--fs-sm);color:var(--muted)}
.dayhead .min-btn,.dayhead .back-today{margin-left:auto}
/* Tarjeta de hábito: capa deslizable + acciones detrás */
.hc{padding:0;position:relative;overflow:hidden;background:var(--card3)}
.hc-in{position:relative;z-index:1;padding:var(--s3);background:var(--card);border-radius:inherit;transition:transform var(--t) var(--ease);touch-action:pan-y}
.hc.done .hc-in{background:color-mix(in srgb,var(--hc) 5%,var(--card))}
.hc.done{background:var(--card)}
/* v1.28 · tarjetas teñidas con el color de cada hábito */
html:not(.no-tint) .hc{border-color:color-mix(in srgb,var(--hc) 34%,var(--border))}
html:not(.no-tint) .hc-in{background:linear-gradient(155deg,color-mix(in srgb,var(--hc) 17%,var(--card)) 0%,color-mix(in srgb,var(--hc) 7%,var(--card)) 70%)}
html:not(.no-tint) .hc-plan{background:color-mix(in srgb,var(--hc) 7%,var(--bg2));border-color:color-mix(in srgb,var(--hc) 22%,var(--border));border-left-color:var(--hc)}
html:not(.no-tint) .hc.done .hc-in{background:color-mix(in srgb,var(--hc) 6%,var(--card))}
html:not(.no-tint) .hc.done{border-color:color-mix(in srgb,var(--hc) 20%,var(--border))}
.hc-acts{position:absolute;right:0;top:0;bottom:0;display:flex;width:168px}
.hc-act{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;color:#fff}
.hc-act span{font-size:var(--fs-xs);font-weight:700}
.hc-act.move{background:color-mix(in srgb,var(--info) 70%,#000)}
.hc-act.skip{background:color-mix(in srgb,var(--danger) 70%,#000)}
.hc-menu{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:var(--r-md);color:var(--dim)}
.hc-menu:active{background:var(--card2)}
.hc-info[aria-expanded="true"] .hc-name::after{content:' ▴';color:var(--dim);font-size:var(--fs-sm)}
.hc-info[aria-expanded="false"] .hc-name::after{content:''}
.chip.qt{min-height:44px;padding:0 var(--s4);font-weight:600}
.ci-row{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}
.ci-row .ci-lb{width:86px;flex:none;margin:0;font-size:var(--fs-sm);font-weight:600}
.ci-row .ci{flex:1;margin:0;gap:var(--s1)}
.card.tmc{display:block;width:100%;text-align:left}
.tmc .go{color:var(--acc);font-weight:600;font-size:var(--fs-sm)}

/* ═════════════ v1.14 · Cuenta atrás, celebración, notas, bienvenida ═════════════ */
.cd-row{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;padding:var(--s2) var(--s3);margin:0 0 var(--s2);border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);font-size:var(--fs-sm);color:var(--muted);text-align:left;overflow:hidden;white-space:nowrap}
.cd-row span{overflow:hidden;text-overflow:ellipsis}.cd-row b{color:var(--text);font-weight:600}.cd-row i{font-style:normal;color:var(--dim)}
.cd-row em{margin-left:auto;font-style:normal;color:var(--acc);font-weight:700}
.cd-n{margin-left:auto;font-size:var(--fs-h2);font-weight:700;text-align:right;line-height:1;font-variant-numeric:tabular-nums}.cd-n small{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.celebrate{position:fixed;inset:0;z-index:500;display:grid;place-items:center;overflow:hidden;background:rgba(0,0,0,.25);animation:fade .2s ease}
.celebrate.out{opacity:0;transition:opacity .4s}
.celebrate i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{top:105%;transform:rotate(540deg) translateX(30px)}}
.cel-card{background:var(--card3);border:1px solid var(--border2);border-radius:var(--r-xl);box-shadow:var(--e2);padding:var(--s5) var(--s6);text-align:center;animation:pop .45s var(--ease)}
.cel-card b{display:block;font-size:var(--fs-h2);font-weight:700;margin-top:var(--s2)}
.cel-card small{display:block;color:var(--muted);font-size:var(--fs-sm);margin-top:var(--s1)}
.cel-big{font-size:56px;line-height:1}
.note-it{display:block;width:100%;text-align:left;padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:44px}
.note-it span{font-size:var(--fs-xs);color:var(--muted)}.note-it span b{color:var(--text);font-weight:600}
.note-it p{font-size:var(--fs-body);margin-top:var(--s1);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wl-ic{font-size:52px;margin:var(--s2) 0 var(--s3)}
.wl-dots{display:flex;justify-content:center;gap:6px;margin:var(--s4) 0 0}
.wl-dots i{width:7px;height:7px;border-radius:50%;background:var(--border2)}.wl-dots i.on{background:var(--acc);width:20px;border-radius:99px}
.gd-list{text-align:left;margin:var(--s2) 0 0;padding:0;list-style:none}
.gd-list li{position:relative;padding:var(--s2) 0 var(--s2) var(--s5);border-top:1px solid var(--border);font-size:var(--fs-body);line-height:1.5;color:var(--muted)}
.gd-list li b{color:var(--text)}
.gd-list li::before{content:'';position:absolute;left:6px;top:1.05em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
/* v1.17 · áreas táctiles de 44 px en botones pequeños */
.cx button{min-height:44px;min-width:44px;padding:0 var(--s2);display:inline-flex;align-items:center;justify-content:center}
.fp-row{min-height:44px}
.ci-row .ci-lb{width:72px}.ci-row .ci{gap:4px}.ci button{min-width:44px}
.chk{cursor:pointer}.chk input{width:22px;height:22px;flex:none}
/* Casillas e interruptores propios (el estilo general de los campos les quitaba el aspecto) */
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;flex:none;border-radius:7px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
#hapticSw input{-webkit-appearance:auto!important;appearance:auto!important;display:block}
input[type=checkbox][switch]:not(#hapticSw input){width:48px;height:30px;border-radius:99px;border:none;background:var(--card2);box-shadow:inset 0 0 0 1px var(--border);position:relative;display:block}
input[type=checkbox][switch]:not(#hapticSw input)::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:none;transform:none;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .18s}
input[type=checkbox][switch]:checked{background:var(--acc);box-shadow:none}
input[type=checkbox][switch]:checked::after{left:21px;transform:none;width:24px;height:24px;border:none}
/* v1.18 · Hoy inteligente */
.sec-late{color:var(--warn)}
.sec-btn{width:100%;min-height:44px;cursor:pointer}
.sec-btn::after{display:none}
.sec-btn span{margin-left:auto;color:var(--acc);letter-spacing:0;text-transform:none;font-size:var(--fs-sm);font-weight:600}
.all-done{text-align:center;padding:var(--s4);margin:var(--s2) 0;border-radius:var(--r-lg);background:color-mix(in srgb,var(--acc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--border));font-weight:600}
.cd-row span{flex:1;min-width:0}
.cd-row i{color:var(--muted);font-weight:600}
.wk-lbl.away small{display:inline-block;margin-top:2px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}

/* ═════════════ v1.19 · Marca IronHabits ═════════════
   Verde = hecho. Naranja «forja» = la marca: rachas, celebración y el botón +. */
:root{--brand:#F97316;--brand-press:#EA580C;--on-brand:#1A0A00;--num:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,system-ui,sans-serif}
.icon-btn.acc{background:linear-gradient(135deg,#FB923C,var(--brand));border-color:transparent;color:var(--on-brand);box-shadow:0 4px 16px color-mix(in srgb,var(--brand) 40%,transparent)}
.icon-btn.acc:active:not(:disabled){background:var(--brand-press)}
.streak{display:inline-flex;align-items:center;gap:2px;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{width:14px;height:14px;fill:color-mix(in srgb,var(--brand) 35%,transparent)}
.kpi-streak b{display:flex;align-items:center;gap:4px;color:var(--brand)}
.kpi-streak b svg{width:26px;height:26px;fill:color-mix(in srgb,var(--brand) 35%,transparent)}
/* Números grandes en letra redondeada (como Apple Fitness) */
.kpi b,.det-kpis b,.sum-ring b,.wd-r b,.cd-n,.acwr b,.dh-t b,.hl-pct,.rk-p,.bar em,.wk-row .vl b{font-family:var(--num);font-variant-numeric:tabular-nums}
.sec-ic{display:inline-grid;place-items:center;width:18px;height:18px}
.sec-ic svg{width:16px;height:16px}
.cel-card{border-color:color-mix(in srgb,var(--brand) 45%,var(--border2));background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 16%,var(--card3)),var(--card3))}
.cel-big{color:var(--brand)}.cel-big svg{width:64px;height:64px;fill:color-mix(in srgb,var(--brand) 40%,transparent)}
.all-done{background:color-mix(in srgb,var(--brand) 10%,var(--card));border-color:color-mix(in srgb,var(--brand) 30%,var(--border))}
.banner .ri{width:32px;height:32px}

/* ═════════════ Pantalla de arranque animada ═════════════ */
#boot{position:fixed;inset:0;z-index:1000;background:#0B0B0F;pointer-events:none;transition:opacity .35s ease}
#boot.out{opacity:0}
.boot-logo{position:absolute;left:50%;top:40%;width:36vw;max-width:220px;height:auto;transform:translate(-50%,-50%)}
#bootRing{transition:stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1)}
.boot-name{position:absolute;left:0;right:0;top:calc(40% + min(18vw,110px) + 6.8vw);text-align:center;color:#F4F4F6;font:900 7.5vw/1 -apple-system,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.02em}
@media (min-width:600px){.boot-name{font-size:44px}}
@media (prefers-reduced-motion:reduce){#bootRing{transition:none}}

/* ═════════════ v1.20 · Tema claro ═════════════ */
:root{--acc:var(--acc-raw,#22C55E);--heat-off:#121217;--heat-empty:#18181E;--heat-miss:#24242C;--grid-alt:rgba(255,255,255,.018);--grid-dash:rgba(255,255,255,.05)}
html[data-theme=light]{color-scheme:light;
  --bg:#F5F5F7;--bg2:#FAFAFB;--card:#FFFFFF;--card2:#F1F1F4;--card3:#E8E8ED;--border:#E2E2E8;--border2:#D2D2DA;
  --text:#15151A;--muted:#5C5C68;--dim:#6E6E7A;
  --acc:color-mix(in srgb,var(--acc-raw,#22C55E) 70%,#000);--brand:#EA580C;--brand-press:#C2410C;
  --e1:0 1px 2px rgba(20,20,30,.07);--e2:0 12px 32px rgba(20,20,30,.16),0 2px 6px rgba(20,20,30,.08);
  --heat-off:#F0F0F3;--heat-empty:#E9E9EE;--heat-miss:#D7D7DF;--grid-alt:rgba(0,0,0,.025);--grid-dash:rgba(0,0,0,.06)}
html[data-theme=light] nav{background:color-mix(in srgb,var(--bg) 88%,transparent)}
html[data-theme=light] .ov{background:rgba(20,20,30,.35)}
html[data-theme=light] .ag-ev.sueno{background:color-mix(in srgb,#94A3B8 25%,var(--bg))}
html[data-theme=light] .celebrate{background:rgba(255,255,255,.3)}
html[data-theme=light] .hc-act{color:#fff}
.ag-hour.alt{background:var(--grid-alt)}.ag-hour::after{border-top-color:var(--grid-dash)}
/* Ordenar */
.so-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);margin-bottom:var(--s2);background:var(--card2);border:1px solid var(--border);border-radius:var(--r-md);touch-action:none;position:relative}
.so-row b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-row.on{z-index:5;box-shadow:var(--e2);border-color:var(--acc);transition:none}
.so-h{width:44px;height:44px;font-size:22px;color:var(--muted);cursor:grab;touch-action:none}

/* ═════════════ v1.20 · Funciones nuevas ═════════════ */
:root{--ice:#7DD3FC}html[data-theme=light]{--ice:#38BDF8}
.freeze{display:flex;gap:var(--s3);align-items:flex-start;background:color-mix(in srgb,var(--ice) 10%,var(--card2));border:1px solid color-mix(in srgb,var(--ice) 35%,var(--border));border-radius:var(--r-md);padding:var(--s3);margin:0 0 var(--s3)}
.freeze span{font-size:22px}.freeze b{display:block;font-size:var(--fs-body)}.freeze small{color:var(--muted);font-size:var(--fs-sm);line-height:1.45}
.rd-chip{display:inline-flex;align-items:center;min-height:28px;padding:0 8px;border-radius:999px;font-weight:700;font-family:var(--num);position:relative}
.rd-chip::after{content:'';position:absolute;inset:-8px -4px}
.rd-hi{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--acc)}.rd-mid{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}.rd-lo{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.min-btn.suggest{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);animation:pulseW 2s ease-in-out 3}
@keyframes pulseW{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 18%,transparent)}}
.sec-act{margin:-12px 0 -12px auto;min-height:44px;padding:0 var(--s3);border-radius:999px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-size:var(--fs-sm);font-weight:700;letter-spacing:0;text-transform:none}
.sec-late::after{display:none}
.start-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:var(--s2);border-radius:var(--r-md);background:color-mix(in srgb,var(--hc) 16%,var(--card2));color:var(--text);font-weight:700;font-size:var(--fs-sm);border:1px solid color-mix(in srgb,var(--hc) 40%,var(--border))}
.rp-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.rp-row div{flex:1;min-width:0}.rp-row b{display:block;font-size:var(--fs-body)}.rp-row small{font-size:var(--fs-sm);color:var(--muted)}
.rp-b{min-height:44px;min-width:44px;padding:0 var(--s3);border-radius:var(--r-md);background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:var(--fs-sm)}
.rp-b.ok{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
#focus{position:fixed;inset:0;z-index:450;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) var(--s4) calc(env(safe-area-inset-bottom) + var(--s3))}
#focus.on{display:flex;animation:fade var(--t) var(--ease)}
.fo-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:var(--fs-sm);font-weight:600}
.fo-x{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-weight:700}
.fo-hd{text-align:center;margin:var(--s3) 0}

/* Tutorial interactivo */

@keyframes trPulse{0%,100%{outline-color:var(--brand);outline-offset:2px}50%{outline-color:rgba(249,115,22,.35);outline-offset:6px}}
@keyframes trShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#tour .tr-blk{position:fixed;pointer-events:auto;touch-action:none}

#tour .tr-tip{position:fixed;pointer-events:auto;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);transition:left .3s var(--ease),top .3s var(--ease);opacity:0;transform:translateY(6px) scale(.98)}

#tour .tr-arr{position:absolute;width:14px;height:14px;background:var(--card2);border:1px solid var(--border);transform:translate(-50%,-50%) rotate(45deg);display:none}
#tour .tr-tip[data-side=down] .tr-arr{display:block;top:0;border-right:0;border-bottom:0}
#tour .tr-tip[data-side=up] .tr-arr{display:block;top:100%;border-left:0;border-top:0}
#tour .tr-tip[data-side=right] .tr-arr{display:block;left:0;border-top:0;border-right:0}

const SCHEMA=4;

/* El plan (agenda y programas, lo pesado) se guarda en IndexedDB, que no tiene el límite de ~5 MB de localStorage.
   En memoria se guarda una copia (PLANCACHE) para que load() siga siendo inmediato. */
const PLAN_DB='ironhabits-plan';
let PLANCACHE=null;try{PLANCACHE=JSON.parse(localStorage.getItem(PLAN_KEY)||'null');}catch(e){}
function planDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('sin IndexedDB'));const r=indexedDB.open(PLAN_DB,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function planIDB(mode,val){const db=await planDB();return new Promise((res,rej)=>{const tx=db.transaction('kv',mode),st=tx.objectStore('kv');let out;
  const q=mode==='readonly'?st.get('plan'):val===null?st.delete('plan'):st.put(val,'plan');q.onsuccess=()=>{out=q.result;};
  tx.oncomplete=()=>{db.close();res(out);};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error);};});}
// Al arrancar: si el plan sigue en localStorage (versiones anteriores) se pasa a IndexedDB; si no, se lee de IndexedDB
async function initPlan(){
  try{
    if(localStorage.getItem(PLAN_KEY)!==null){await planIDB('readwrite',PLANCACHE);localStorage.removeItem(PLAN_KEY);return;}
    const P=await planIDB('readonly');if(P){PLANCACHE=P;mergePlanInto(S);}
  }catch(e){}
}

/* ═════════════ PLANTILLAS DE HÁBITOS ═════════════
   Una plantilla guarda cómo es un hábito (nombre, icono, color, tipo, pasos, duración, hora, momento, frecuencia y plan
   semanal o por rotación), sin fechas ni registros. Al crear un hábito desde una plantilla se hace una COPIA con ids
   nuevos para los pasos: tachar pasos en un día no toca la plantilla ni otros hábitos. El programa día a día de tu
   plan (p. ej. la isla de cada semana de Francés) no se copia: va ligado a las fechas de ese hábito. */
function tplFrom(h){
  const sc=h.schedule||{},pl=h.plan||{};
  let schedule={mode:sc.mode||'daily',days:[...(sc.days||[1,2,3,4,5])],times:sc.times||3,n:sc.n||2,dates:[]};

function ask(msg,ok='Aceptar',danger=false){return new Promise(res=>{_dlg=res;openSheet(`<div class="sheet-title">¿Seguro?</div><p class="hint" style="font-size:.9rem;color:var(--text)">${esc(msg)}</p><div class="btns"><button class="btn ghost" onclick="dlgDone(false)">Cancelar</button><button class="btn ${danger?'danger':'pri'}" onclick="dlgDone(true)">${esc(ok)}</button></div>`);});}
function dlgDone(v){const r=_dlg;_dlg=null;closeSheet();if(r)r(v);}
function getH(id){return S.habits.find(h=>h.id===id);}
function hexA(hex,a){return hex+a;}
function isPlanKind(k){return k==='ironhabits-plan'||k==='rutina-plan';} // «rutina-plan»: planes de cuando la app se llamaba Rutina

function ring(p,size,sw,color){
  const r=(size-sw)/2,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,p||0))),h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" stroke="var(--border)" stroke-width="${sw}" fill="none"/>${p>0?`<circle cx="${h}" cy="${h}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${h} ${h})" style="transition:stroke-dashoffset .4s"/>`:''}</svg>`;
}

/* ═════════════ LÓGICA DE HÁBITOS ═════════════ */
function entry(h,k){return (S.logs[k]||{})[h.id];}
function progress(h,k){
  const e=entry(h,k);if(!e)return 0;
  if(e.min)return 1;
  if(h.type==='check'&&e.mins>0)return 1; // en cantidad o checklist, apuntar tiempo suma al total semanal pero no completa
  if(h.type==='check')return e.v?1:0;
  if(h.type==='checklist'){const n=h.steps.length;if(!n)return 0;return h.steps.filter(s=>(e.steps||[]).includes(s.id)).length/n;}
  return Math.min(1,(e.v||0)/(h.target||1));
}
function isDone(h,k){return progress(h,k)>=1;}

// ¿Toca según la frecuencia? (sin tener en cuenta el cupo semanal)
function isScheduled(h,k){
  if(k<h.start)return false;
  const s=h.schedule;
  switch(s.mode){
    case 'daily':return true;
    case 'weekdays':return (s.days||[]).includes(dow(k));
    case 'xweek':return true;
    case 'everyN':return diffDays(h.start,k)%Math.max(1,s.n||1)===0;
    case 'dates':return (s.dates||[]).includes(k);
  }
  return false;
}
/* Cambios de agenda (anular, mover, cambiar hora). Los hábitos usan el id «h:<id>». */
function tm(s){if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m;}
function fmtT(m){m=Math.round(m);return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;}
function agOv(k,id){return ((S.agenda||{})[k]||{})[id];}
function agSet(k,id,o){_wc=null;S.agenda=S.agenda||{};if(o){(S.agenda[k]=S.agenda[k]||{})[id]=o;}else if(S.agenda[k]){delete S.agenda[k][id];if(!Object.keys(S.agenda[k]).length)delete S.agenda[k];}}
function baseEvent(k,id){return ((S.agendaBase||{})[k]||[]).find(e=>e.id===id);}
function isCancelledH(h,k){const o=agOv(k,'h:'+h.id);return !!(o&&(o.cancel||o.moveTo));}
function movedFrom(h,k){const o=agOv(k,'in:'+h.id);return o&&!o.extra?o.from:null;}
function isExtra(h,k){const o=agOv(k,'in:'+h.id);return !!(o&&o.extra);}
function hasLog(h,k){return !!(S.logs[k]&&S.logs[k][h.id])&&isDone(h,k);}
function habitTime(h,k){
  const mi=agOv(k,'in:'+h.id);if(mi)return mi.start?{start:mi.start,end:mi.end}:null;
  const o=agOv(k,'h:'+h.id);if(o&&o.start)return{start:o.start,end:o.end};
  const b=baseEvent(k,'h:'+h.id);if(b)return{start:b.start,end:b.end};
  if(h.time&&h.time.start&&!hasBase(h))return{start:h.time.start,end:fmtT(tm(h.time.start)+(h.time.dur||30))};
  return null;
}
// ¿Tiene este hábito bloques en la agenda del plan? (si no, su hora sale del editor)
function hasBase(h){const c=hasBase._c||(hasBase._c=new Map());const key=h.id+'|'+Object.keys(S.agendaBase||{}).length;if(c.has(key))return c.get(key);
  let r=false;for(const k in S.agendaBase||{})if(S.agendaBase[k].some(e=>e.id==='h:'+h.id)){r=true;break;}c.set(key,r);return r;}
function classCancelled(k){const o=agOv(k,'clase');return !!(o&&o.cancel);}
function momentOfTime(s){const m=tm(s);return m<14*60?'manana':m<20*60?'tarde':'noche';}
function hasDatePlan(h,k){return !!(h.plan&&((h.plan.dates&&h.plan.dates[k])||(h.plan.program&&h.plan.program[k])));}
function showOnBase(h,k){if(hasLog(h,k))return true;if(movedFrom(h,k))return true;if(isCancelledH(h,k))return false;return isScheduled(h,k)||hasDatePlan(h,k);}
/* Volumen semanal (como los km de Runna): minutos hechos frente a minutos planificados en la semana.
   Si cumples el total, los días que no hiciste no cuentan como fallo. Anular un día NO baja el objetivo (lo puedes compensar);
   una pausa (vacaciones, lesión) sí lo baja. */
var _wc=null;function wcache(){if(!_wc){_wc=new Map();queueMicrotask(()=>_wc=null);}return _wc;}
function evDur(h,k){const t=habitTime(h,k);return t&&t.start?tm(t.end)-tm(t.start):typicalDur(h);}
function minParse(t){const m=/(\d+)\s*min/.exec(t||'');return m?+m[1]:10;}
function minsOf(h,k){
  const e=entry(h,k);if(!e)return 0;
  if(h.type==='time')return e.v||0;
  if(e.mins!=null)return e.mins;
  if(e.min)return minParse(h.minimal);
  const p=progress(h,k);return p>0?Math.round(evDur(h,k)*p):0;
}
function isPaused(h,k){const o=agOv(k,'h:'+h.id);return !!(o&&o.pause);}
function plannedMins(h,k){
  if(k<h.start||isPaused(h,k))return 0;
  if(h.schedule.mode==='xweek')return 0;
  if(!(isScheduled(h,k)||hasDatePlan(h,k)))return 0;
  const b=baseEvent(k,'h:'+h.id);return b?tm(b.end)-tm(b.start):(h.type==='time'&&h.target?h.target:typicalDur(h));
}
function weekGoal(h,k){
  const ws=weekStartK(k),c=wcache(),key='g'+h.id+ws;if(c.has(key))return c.get(key);
  let g=0;
  if(h.weekGoal)g=h.weekGoal;
  else if(h.schedule.mode==='xweek'){if(addDays(ws,6)>=h.start)g=(h.schedule.times||1)*typicalDur(h);}
  else for(let i=0;i<7;i++)g+=plannedMins(h,addDays(ws,i));
  c.set(key,g);return g;
}
function weekMins(h,k){const ws=weekStartK(k),c=wcache(),key='m'+h.id+ws;if(c.has(key))return c.get(key);let m=0;for(let i=0;i<7;i++)m+=minsOf(h,addDays(ws,i));c.set(key,m);return m;}
function weekMet(h,k){const g=weekGoal(h,k);return g>0&&weekMins(h,k)>=g;}
// Un día que tocaba y no hiciste: ¿es fallo? No si la semana va en curso (aún puedes compensar) o si cumpliste el total.
function missCounts(h,k){const t=todayK();if(weekStartK(k)===weekStartK(t))return false;return !weekMet(h,k);}
function fmtDur(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)} h${m%60?' '+pad(m%60):''}`:`${m} min`;}
function weekCount(h,k){const ws=weekStartK(k);let c=0;for(let i=0;i<7;i++)if(isDone(h,addDays(ws,i)))c++;return c;}
// ¿Aparece en la lista de ese día?
function showOn(h,k){
  if(hasLog(h,k)||isExtra(h,k))return true;
  if(movedFrom(h,k))return true;
  if(isCancelledH(h,k))return false;
  if(hasDatePlan(h,k))return true;
  if(!isScheduled(h,k))return false;
  if(h.schedule.mode==='xweek'){
    if(isDone(h,k))return true;
    const ws=weekStartK(k);let other=0;
    for(let i=0;i<7;i++){const d=addDays(ws,i);if(d!==k&&isDone(h,d))other++;}
    return other<(h.schedule.times||1);
  }
  return true;
}
function momentFor(h,k){const t=habitTime(h,k);if(t&&t.start)return momentOfTime(t.start);const e=h.plan&&h.plan.program&&h.plan.program[k];return (e&&typeof e==='object'&&e.moment)||h.moment||'any';}
function dayHabits(k){return S.habits.filter(h=>!h.archived&&showOn(h,k));}
function dayStats(k){const hs=dayHabits(k);return{total:hs.length,done:hs.filter(h=>isDone(h,k)).length};}

function streaks(h){
  const t=todayK();
  if(h.schedule.mode==='xweek'){
    const times=h.schedule.times||1,tw=weekStartK(t);
    let ws=weekStartK(h.start),run=0,best=0;
    while(ws<=tw){
      if(weekCount(h,ws)>=times){run++;if(run>best)best=run;}
      else if(ws!==tw)run=0;
      ws=addDays(ws,7);
    }
    return{cur:run,best,unit:'sem'};
  }
  const c=wcache(),ck='st'+h.id;if(c.has(ck))return c.get(ck);
  const first=Object.keys(S.logs).filter(d=>hasLog(h,d)).sort()[0];
  // Comodín de racha: cada semana que llegas al total ganas uno (máx. 2); un día fallado gasta uno y la racha no se rompe
  let k=first&&first<h.start?first:h.start,run=0,best=0,guard=0,freeze=0;const frozen=[];
  while(k<=t&&guard++<4000){
    if(showOnBase(h,k)){
      if(isDone(h,k)){run++;if(run>best)best=run;}
      else if(k!==t&&missCounts(h,k)){if(freeze>0&&run>0){freeze--;frozen.push(k);}else run=0;}
    }
    if(dow(k)===0&&k<t&&weekMet(h,k))freeze=Math.min(2,freeze+1);
    k=addDays(k,1);
  }
  const r={cur:run,best,unit:'d',freeze,frozen};c.set(ck,r);return r;
}
function habitRate(h,days=30){
  const t=todayK();
  if(h.schedule.mode==='xweek'){
    const times=h.schedule.times||1;let got=0,need=0;
    let ws=weekStartK(addDays(t,-(days-1)));
    while(ws<=t){if(addDays(ws,6)>=h.start){need+=times;got+=Math.min(weekCount(h,ws),times);}ws=addDays(ws,7);}
    return need?got/need:null;
  }
  let due=0,done=0;
  for(let i=0;i<days;i++){
    const k=addDays(t,-i);if(!showOnBase(h,k))continue;
    const d=isDone(h,k);if(k===t&&!d)continue;
    if(!d&&!missCounts(h,k)){if(weekMet(h,k)){due++;done++;}continue;}
    due++;if(d)done++;
  }
  return due?done/due:null;
}
function countDone(h){let c=0;for(const k in S.logs)if(S.logs[k][h.id]&&isDone(h,k))c++;return c;}

// Índice de rotación: el pasado avanza con cada vez que lo completas; el futuro, con cada día programado
function cycleIdx(h,k){
  const t=todayK();let c=0,d=h.start,guard=0;
  while(d<k&&guard++<4000){
    if(d<t){if(isDone(h,d))c++;}
    else if(d===t){if(isDone(h,d))c++;}
    else if(h.schedule.mode!=='xweek'&&isScheduled(h,d))c++;
    d=addDays(d,1);
  }
  return c;
}
function planFor(h,k){
  const mf=movedFrom(h,k);
  if(mf&&mf!==k){const q=planFor(h,mf);return q?{text:q.text,tag:`↪ Movido desde el ${shortDate(mf)}${q.tag?' · '+q.tag:''}`}:{text:'',tag:`↪ Movido desde el ${shortDate(mf)}`};}
  const p=h.plan||{};
  if(p.dates&&p.dates[k])return{text:p.dates[k],tag:'Solo este día'};
  if(isExtra(h,k)&&!(p.program&&p.program[k])){
    const ks=p.program?Object.keys(p.program).filter(d=>d<k).sort():[];
    const last=ks.length?p.program[ks[ks.length-1]]:null;
    const txt=last?(typeof last==='string'?last:last.text||''):'';
    return{text:txt,tag:'➕ Sesión extra · cuenta para tu progreso'+(last&&last.tag?' · repite: '+last.tag:'')};
  }
  if(p.program&&p.program[k]){const e=p.program[k];if(typeof e==='string')return{text:e,tag:''};
    if(e.alt&&classCancelled(k))return{text:e.alt.text,tag:e.alt.tag};
    return{text:e.text||'',tag:e.tag||'',blocks:e.blocks,notice:e.notice,min:e.min,mark:e.mark};}
  if(p.mode==='weekly'){const t=(p.weekly||{})[dow(k)];return t?{text:t,tag:''}:null;}
  if(p.mode==='cycle'){
    const list=(p.cycle||[]).filter(x=>x&&x.trim());if(!list.length)return null;
    const i=cycleIdx(h,k)%list.length;
    return{text:list[i],tag:`Sesión ${String.fromCharCode(65+i)} · rotación de ${list.length}`};
  }
  return null;
}
function schedText(h){
  const s=h.schedule;
  if(s.mode==='daily')return 'Cada día';
  if(s.mode==='weekdays'){
    const d=[...(s.days||[])].sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
    if(d.length===7)return 'Cada día';
    if(d.join()==='1,2,3,4,5')return 'Lunes a viernes';
    if(d.join()==='6,0')return 'Fines de semana';
    return d.map(x=>DOW_L[x]).join(' · ');
  }
  if(s.mode==='xweek')return `${s.times}× por semana`;
  if(s.mode==='everyN')return `Cada ${s.n} días`;
  if(s.mode==='dates'){
    const t=todayK(),ds=(s.dates||[]).filter(d=>d>=addDays(t,-14)&&d<=addDays(t,27));
    if(!ds.length)return (s.dates||[]).length?'Según el plan':'Sin fechas';
    const per=Math.round(ds.length/6*10)/10,days=[...new Set(ds.map(dow))].sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
    if(days.length<=4&&per>=days.length-0.5)return days.map(x=>DOW_L[x]).join(' · ');
    return `≈${Math.round(per)}× por semana`;
  }
  return '';
}
function targetText(h){
  if(h.type==='count')return `${h.target} ${h.unit||''}`.trim();
  if(h.type==='time')return `${h.target} min`;
  if(h.type==='checklist')return `${h.steps.length} pasos`;
  return '';
}

/* ═════════════ NAVEGACIÓN ═════════════ */
function go(v){
  if(v==='hab'||v==='stats')v='prog'; // las antiguas pestañas Hábitos y Estadísticas viven ahora en Progreso
  view=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
  render();
  if(typeof tourMaybeMini==='function')tourMaybeMini(v);
}
function render(){
  if(view==='hoy')renderHoy();
  else if(view==='agenda')renderAgenda();
  else if(view==='prog')renderProg();
  else renderSet();
}
// Progreso = resumen (KPIs y revisión) + tus hábitos + gráficas
function renderProg(){
  if(!$('#habBody'))$('#progBody').innerHTML=`<div id="statsBody"></div><div class="sec">Tus hábitos</div><div id="habBody"></div><div id="statsMore"></div>`;
  renderHab();renderStats();
}

/* ═════════════ HOY ═════════════ */
function pick(k){sel=k;render();}
function wkShift(n){sel=addDays(sel,7*n);render();}
function weekLabel(){
  const ws=weekStartK(sel),tw=weekStartK(todayK()),d=Math.round(diffDays(tw,ws)/7);
  const rel=d===0?'Esta semana':d===1?'Semana que viene':d===-1?'Semana pasada':d>0?`Dentro de ${d} semanas`:`Hace ${-d} semanas`;
  const we=addDays(ws,6),y=ws.slice(0,4)!==todayK().slice(0,4)||we.slice(0,4)!==todayK().slice(0,4)?' '+we.slice(0,4):'';
  return `${rel}<small>${sel===todayK()?shortDate(ws)+' – '+shortDate(we)+y:'↩ Volver a hoy'}</small>`;
}
// Deslizar el dedo sobre los días cambia de semana
function swipeWeek(el){let x0=null,y0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)wkShift(dx<0?1:-1);},{passive:true});}

function renderWeek(target){
  const ws=weekStartK(sel),t=todayK();let html='';
  for(let i=0;i<7;i++){
    const k=addDays(ws,i),st=dayStats(k),p=st.total?st.done/st.total:0;
    html+=`<button class="wd ${k===sel?'sel':''} ${k===t?'today':''} ${k>t?'fut':''}" onclick="pick('${k}')">
      <span class="wd-l">${DOW_L[dow(k)]}</span>
      <span class="wd-r">${ring(k>t?0:p,32,3,'var(--acc)')}<b>${pk(k).getDate()}</b></span></button>`;
  }
  $(target||'#wkDays').innerHTML=html;
  const lb=$(target==='#agWeek'?'#agLbl':'#wkLbl');if(lb){lb.innerHTML=weekLabel();lb.classList.toggle('away',sel!==t);}
}

function renderHoy(){
  const k=sel,t=todayK();
  $('#hoyTitle').textContent=k===t?'Hoy':k===addDays(t,-1)?'Ayer':k===addDays(t,1)?'Mañana':DOW_N[dow(k)];
  $('#hoySub').textContent=longDate(k)+(pk(k).getFullYear()!==new Date().getFullYear()?' '+pk(k).getFullYear():'');
  renderWeek();
  const body=$('#hoyBody');
  if(!S.habits.length){
    setBell([]);
    body.innerHTML=`<div class="card empty"><div class="big">🗓️</div><h3>Empieza a montar tu rutina</h3>
      <p>Añade tus hábitos uno a uno, dile qué días tocan y qué hay que hacer exactamente cada día.</p>
      <button class="btn pri" onclick="openEditor()">+ Nuevo hábito</button>
      <button class="btn ghost mt8" onclick="loadExamples()">Cargar hábitos de ejemplo</button></div>`;
    return;
  }
  const hs=dayHabits(k);
  const done=hs.filter(h=>isDone(h,k)).length,fut=k>t,minOn=!!(S.minDays||{})[k];
  // 1 · Una sola tarjeta destacada (lo más importante ahora); el resto, en la campana
  let html='';
  if(k===t){const sp=spotlight(k);html+=sp.main;setBell(sp.rest);}else setBell([]);
  // 2 · Cabecera compacta del día
  const pct=hs.length?done/hs.length:0,rd=k===t?readiness(k):null,low=rd&&rd.score<45&&!minOn;
  html+=`<div class="dayhead"><span class="dh-ring">${ring(pct,40,5,'var(--acc)')}</span>
    <div class="dh-t"><b>${fut?`${hs.length} programado${hs.length===1?'':'s'}`:hs.length?(done===hs.length?'Día completo 🔥':`${done} de ${hs.length} hechos`):'Día libre'}</b><small>${fut?'Así se presenta el día':hs.length&&done<hs.length?`Te falta${hs.length-done===1?'':'n'} ${hs.length-done}`:hs.length?'¡Bien hecho!':'No hay nada programado'}${rd?` · <button class="rd-chip rd-${rd.level}" onclick="readinessSheet()">⚡ ${rd.score}</button>`:''}</small></div>
    ${k!==t?`<button class="back-today" onclick="pick('${t}')">Volver a hoy</button>`:hs.length?`<button class="min-btn ${minOn?'on':''} ${low?'suggest':''}" onclick="toggleMinDay('${k}')" aria-pressed="${minOn}">🪫 ${minOn?'Día flojo activado':low?'¿Día flojo?':'Día flojo'}</button>`:''}</div>`;
  if(k===t)html+=countdownRow();
  if(minOn)html+=`<p class="hint" style="margin:0 4px 8px">Cada hábito muestra su versión corta. Hazla y cuenta para la racha.</p>`;
  // 3 · Hábitos por franjas
  if(!hs.length){
    html+=`<div class="card empty"><div class="big">🌙</div><h3>Nada programado</h3><p>Descansa o adelanta algo de otro día.</p></div>`;
  } else {
    html+=habitSections(hs,k);
  }
  if(k<=addDays(t,7))html+=`<button class="btn ghost mt8" onclick="extraSheet('${k}')">➕ Añadir sesión extra</button>`;
  const cx=S.habits.filter(h=>!h.archived&&isCancelledH(h,k)&&!hasLog(h,k));
  if(cx.length){
    html+=`<div class="sec">Saltados o movidos</div>`+cx.map(h=>{const o=agOv(k,'h:'+h.id);return `<div class="cx">${esc(h.emoji)} <span>${esc(h.name)} · ${o.moveTo?`movido al ${shortDate(o.moveTo)}`:'saltado'}${o.reason&&o.reason!=='Saltado'?` (${esc(o.reason)})`:''}</span><button onclick="evRestore('${k}','h:${h.id}')">Restaurar</button></div>`;}).join('');
  }
  // 4 · Total semanal (plegado) y nota
  html+=weekCard(k);
  html+=`<div class="sec">Nota del día</div><div class="card note"><textarea id="noteIn" placeholder="Cómo ha ido, sensaciones, qué ajustar…" oninput="setNote(this.value)">${esc(S.notes[k]||'')}</textarea></div>`;
  if(Object.keys(S.notes).length||Object.values(S.logs).some(d=>Object.values(d).some(e=>e&&e.note)))html+=`<button class="btn ghost" onclick="NQ='';notesSheet()">📝 Ver todas tus notas</button>`;
  body.innerHTML=html;
}
/* Orden de Hoy según la hora: la franja de ahora primero, luego las siguientes, después lo que quedó pendiente
   de franjas pasadas y, al final, «Hechos hoy» plegado. Los demás días: franjas en orden y lo hecho al final. */
function habitSections(hs,k){
  const t=todayK(),isToday=k===t,tt=h=>{const x=habitTime(h,k);return x&&x.start?tm(x.start):9999;};
  const pend=hs.filter(h=>!isDone(h,k)),done=hs.filter(h=>isDone(h,k));

function linkLabel(u){
  if(/youtube\.com|youtu\.be/.test(u))return '▶ Buscar en YouTube';
  if(/google\.[a-z.]+\/search/.test(u))return '🔎 Buscar en Google';
  try{const x=new URL(u.replace(/&amp;/g,'&'));let p=(x.pathname+x.search).replace(/\/$/,'');if(p.length>28)p=p.slice(0,27)+'…';return '↗ '+x.hostname.replace(/^www\./,'')+p;}catch(e){return 'Abrir enlace ↗';}
}
function linkify(l){return l.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${linkLabel(u)}</a>`);}
function fmtPlan(t){
  return esc(t).split('\n').map(l=>{
    const h=l.match(/^\s*#\s+(.*)/);
    if(h)return `<div class="pl-h">${linkify(h[1])}</div>`;
    const m=l.match(/^\s*[-•*]\s+(.*)/);
    if(m)return `<div class="pl-li">${linkify(m[1])}</div>`;
    return l.trim()?`<div>${linkify(l)}</div>`:'<div class="pl-gap"></div>';
  }).join('');
}

function ens(h,k){_wc=null;S.logs[k]=S.logs[k]||{};const e=S.logs[k][h.id]=S.logs[k][h.id]||{v:0,steps:[]};e.steps=e.steps||[];return e;}
function clean(h,k){

function commit(h,k,was,p0){

function act(id,k=sel){ // k: el día del bloque o tarjeta que se ha tocado (por defecto, el seleccionado)

}
function minus(id){

function freeParts(evs){

  const out=[];
